<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-16}}
      @keyframes scan{0%{opacity:.3}50%{opacity:.7}100%{opacity:.3}}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.5s linear infinite}
      .scan{animation:scan 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="400" ry="200" fill="url(#glow-r)" filter="url(#blur)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" letter-spacing="2">AI FACT-CHECKING CHECKLIST</text>
  <text x="600" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e" letter-spacing="2">10-MINUTE VERIFICATION WORKFLOW</text>

  <!-- Left Column: 10-Minute Workflow -->
  <text x="80" y="115" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e0304e" letter-spacing="1">THE 10-MINUTE WORKFLOW</text>

  <!-- Min 1-2 -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="500" height="45" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="142" width="36" height="22" rx="4" fill="#e0304e" opacity="0.15"/>
    <text x="90" y="157" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0304e">1-2m</text>
    <text x="120" y="157" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Ask AI to identify key claims</text>
  </g>
  <!-- Min 3-4 -->
  <g filter="url(#shadow)">
    <rect x="60" y="185" width="500" height="45" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="197" width="36" height="22" rx="4" fill="#642f7f" opacity="0.15"/>
    <text x="90" y="212" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#b57edd">3-4m</text>
    <text x="120" y="212" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Search for primary sources</text>
  </g>
  <!-- Min 5-6 -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="500" height="45" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="252" width="36" height="22" rx="4" fill="#e0304e" opacity="0.15"/>
    <text x="90" y="267" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0304e">5-6m</text>
    <text x="120" y="267" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Open original documentation</text>
  </g>
  <!-- Min 7 -->
  <g filter="url(#shadow)">
    <rect x="60" y="295" width="500" height="45" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="307" width="36" height="22" rx="4" fill="#642f7f" opacity="0.15"/>
    <text x="90" y="322" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#b57edd">7m</text>
    <text x="120" y="322" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Check dates and versions</text>
  </g>
  <!-- Min 8 -->
  <g filter="url(#shadow)">
    <rect x="60" y="350" width="500" height="45" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="362" width="36" height="22" rx="4" fill="#e0304e" opacity="0.15"/>
    <text x="90" y="377" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0304e">8m</text>
    <text x="120" y="377" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Compare one independent source</text>
  </g>
  <!-- Min 9 -->
  <g filter="url(#shadow)">
    <rect x="60" y="405" width="500" height="45" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="417" width="36" height="22" rx="4" fill="#642f7f" opacity="0.15"/>
    <text x="90" y="432" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#b57edd">9m</text>
    <text x="120" y="432" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Remove unsupported claims</text>
  </g>
  <!-- Min 10 -->
  <g filter="url(#shadow)">
    <rect x="60" y="460" width="500" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.8" opacity="0.9"/>
    <rect x="72" y="472" width="36" height="22" rx="4" fill="#3fb950" opacity="0.15"/>
    <text x="90" y="487" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950">10m</text>
    <text x="120" y="487" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Rewrite conclusion from evidence</text>
  </g>

  <!-- Right Column: Checklist -->
  <text x="640" y="115" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#3fb950" letter-spacing="1">PRE-PUBLICATION CHECKLIST</text>

  <!-- Checklist items -->
  <g filter="url(#shadow)">
    <rect x="620" y="130" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="152" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="156" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="156" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">What are the most important claims?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="185" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="207" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="211" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="211" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Is the source primary or secondary?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="240" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="262" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="266" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="266" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Can I find the original document?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="295" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="317" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="321" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="321" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Does the source actually support the claim?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="350" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="372" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="376" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="376" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Is the source current?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="405" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="427" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="431" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="431" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Are multiple sources independent?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="460" width="530" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.6" opacity="0.9"/>
    <circle cx="645" cy="482" r="8" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
    <text x="645" y="486" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    <text x="665" y="486" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Is this fact, opinion, or prediction?</text>
  </g>

  <!-- Bottom banner -->
  <rect x="295" y="530" width="610" height="48" rx="10" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.9"/>
  <text x="600" y="553" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">10 minutes of verification can save hours of misinformation.</text>
  <text x="600" y="568" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Make it a habit, not an afterthought.</text>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>

    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#coin-grad)" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="32" font-weight="700">FRSC</text>
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="14">Farisium Coin</text>
  </g>
  <g opacity="0.4">

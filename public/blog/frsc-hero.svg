    <circle cx="350" cy="120" r="2" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="850" cy="150" r="3" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="1000" cy="200" r="2" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="250" cy="450" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="950" cy="480" r="4" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="450" cy="500" r="2" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="750" cy="180" r="2" fill="#ffffff" fill-opacity="0.2"/>

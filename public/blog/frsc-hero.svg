<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#642f7f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gradient-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="40%" stop-color="#e0304e"/>
      <stop offset="60%" stop-color="#642f7f"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="coin-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <radialGradient id="coin-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="600" cy="315" r="140" fill="url(#coin-glow)"/>
  <g transform="translate(600, 315)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      @keyframes glow { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
      @keyframes dash { to { stroke-dashoffset:-16 } }
      @keyframes rise { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes flash { 0%,100%{opacity:0.4} 50%{opacity:1} }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .dash { animation: dash 1.4s linear infinite; }
      .rise { animation: rise 0.9s ease-out both; }
      .flash { animation: flash 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="430" ry="210" fill="url(#glow-g)" filter="url(#blur50)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="2">ACCESS CONTROL BEFORE RETRIEVAL</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">IDENTIFY USER → GENERAL PERMISSION → SEARCH AUTHORIZED SOURCES</text>

  <!-- Role cards -->
  <g class="rise" style="animation-delay:0s">
    <rect x="90" y="150" width="320" height="150" rx="14" fill="#161b22" stroke="#e0304e" stroke-width="1.5"/>
    <circle cx="130" cy="188" r="16" fill="none" stroke="#e0304e" stroke-width="2"/>
    <text x="130" y="194" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e0304e">C</text>
    <text x="250" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Customers</text>
    <rect x="110" y="214" width="180" height="4" rx="2" fill="#e0304e" opacity="0.8"/>
    <text x="250" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Public services</text>
    <text x="250" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Pricing · FAQs · policies</text>
    <text x="250" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">No internal docs</text>
  </g>

  <g class="rise" style="animation-delay:0.25s">
    <rect x="440" y="150" width="320" height="150" rx="14" fill="#161b22" stroke="url(#accent)" stroke-width="1"/>
    <circle cx="480" cy="188" r="16" fill="none" stroke="#642f7f" stroke-width="2"/>
    <text x="480" y="194" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#b57edd">S</text>
    <text x="600" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Support Staff</text>
    <rect x="460" y="214" width="180" height="4" rx="2" fill="#642f7f" opacity="0.8"/>
    <text x="600" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Customer + internal</text>
    <text x="600" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Troubleshooting</text>
    <text x="600" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Support procedures</text>
  </g>

  <g class="rise" style="animation-delay:0.5s">
    <rect x="790" y="150" width="320" height="150" rx="14" fill="#161b22" stroke="#e0304e" stroke-width="1.5" class="glow"/>
    <circle cx="830" cy="188" r="16" fill="none" stroke="#e0304e" stroke-width="2"/>
    <text x="830" y="194" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e0304e">M</text>
    <text x="950" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Managers</text>
    <rect x="810" y="214" width="180" height="4" rx="2" fill="#e0304e" opacity="0.8"/>
    <text x="950" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Operational docs</text>
    <text x="950" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Restricted policies</text>
    <text x="950" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Level 3 access</text>
  </g>

  <!-- Flow line -->
  <rect x="60" y="460" width="1080" height="3" rx="1.5" fill="url(#flow)" opacity="0.35"/>
  <rect x="60" y="460" width="1080" height="3" rx="1.5" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 16" class="dash" opacity="0.9"/>

  <!-- Sequence -->
  <g class="rise" style="animation-delay:0.7s">
    <circle cx="160" cy="460" r="24" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="160" y="467" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0304e">1</text>
    <text x="160" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Identify user</text>
  </g>

  <g class="rise" style="animation-delay:0.85s">
    <circle cx="400" cy="460" r="24" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="400" y="467" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#b57edd">2</text>
    <text x="400" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Set permission</text>
  </g>

  <g class="rise" style="animation-delay:1s">
    <circle cx="640" cy="460" r="24" fill="#161b22" stroke="url(#accent)" stroke-width="1"/>
    <text x="640" y="467" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">3</text>
    <text x="640" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Search authorized</text>
  </g>

  <g class="rise" style="animation-delay:1.15s">
    <circle cx="880" cy="460" r="24" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="880" y="467" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0304e">4</text>
    <text x="880" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Generate answer</text>
  </g>

  <!-- Principle banner -->
  <rect x="280" y="548" width="640" height="56" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.92"/>
  <text x="600" y="572" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" class="flash">Security should be enforced by software, not just prompts.</text>
  <text x="600" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Restrict access before retrieval — not after.</text>

  <!-- Brand -->
  <text x="600" y="622" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e" opacity="0.7" letter-spacing="2">farisium.com</text>
</svg>

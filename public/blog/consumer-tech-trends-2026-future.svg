<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e"/>
      <stop offset="100%" style="stop-color:#642f7f"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="cardGlow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#642f7f" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="300" cy="200" r="200" fill="#642f7f" opacity="0.04" filter="url(#blur1)"/>
  <circle cx="900" cy="400" r="180" fill="#e0304e" opacity="0.03" filter="url(#blur1)"/>

  <g opacity="0.025" stroke="#642f7f" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#e6edf3" font-weight="700" letter-spacing="-0.3">6 Consumer Tech Trends 2026</text>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">Key Innovations Shaping Everyday Life</text>

  <!-- 2x3 Grid Layout -->
  <!-- Row 1 -->
  <!-- Card 1: AI Home -->
  <g transform="translate(80,100)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="#642f7f" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <path d="M40,45 L50,35 L60,45" fill="none" stroke="#642f7f" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="40" y="45" width="20" height="12" rx="2" fill="none" stroke="#642f7f" stroke-width="1"/>
    <circle cx="65" cy="30" r="3" fill="#e0304e" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">AI Home Assistants</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Matter standard enables seamless</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">multi-device orchestration</text>
    <rect x="90" y="85" width="60" height="20" rx="10" fill="#642f7f" opacity="0.12"/>
    <text x="120" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#642f7f" font-weight="500">Autonomous</text>
  </g>

  <!-- Card 2: Human UX -->
  <g transform="translate(440,100)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="#e0304e" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="50" cy="40" r="7" fill="none" stroke="#e0304e" stroke-width="1.2"/>
    <path d="M42,52 Q50,60 58,52" fill="none" stroke="#e0304e" stroke-width="1.2"/>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Human-Centric Design</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Haptics, neural input, and devices</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">that feel intuitively natural</text>
    <rect x="90" y="85" width="60" height="20" rx="10" fill="#e0304e" opacity="0.12"/>
    <text x="120" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#e0304e" font-weight="500">Intuitive</text>
  </g>

  <!-- Card 3: Smart Glasses -->
  <g transform="translate(800,100)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="#642f7f" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <rect x="34" y="38" width="12" height="8" rx="2" fill="none" stroke="#642f7f" stroke-width="1.2"/>
    <rect x="52" y="38" width="12" height="8" rx="2" fill="none" stroke="#642f7f" stroke-width="1.2"/>
    <line x1="46" y1="42" x2="52" y2="42" stroke="#642f7f" stroke-width="1"/>
    <circle cx="50" cy="42" r="2" fill="#e0304e" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Smart Glasses 2.0</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">AR navigation, real-time translation,</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">and hands-free AI access</text>
    <rect x="90" y="85" width="60" height="20" rx="10" fill="#642f7f" opacity="0.12"/>
    <text x="120" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#642f7f" font-weight="500">Wearable</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: Robots -->
  <g transform="translate(80,270)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="#e0304e" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <rect x="40" y="33" width="20" height="18" rx="4" fill="none" stroke="#e0304e" stroke-width="1.2"/>
    <circle cx="46" cy="41" r="2" fill="#e0304e" opacity="0.5"/>
    <circle cx="54" cy="41" r="2" fill="#e0304e" opacity="0.5"/>
    <line x1="50" y1="33" x2="50" y2="27" stroke="#e0304e" stroke-width="1.5"/>
    <circle cx="50" cy="27" r="2" fill="#e0304e" opacity="0.4"/>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Home Robots</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Autonomous helpers for chores,</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">security, and companionship</text>
    <rect x="90" y="85" width="80" height="20" rx="10" fill="#e0304e" opacity="0.12"/>
    <text x="130" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#e0304e" font-weight="500">Mainstream</text>
  </g>

  <!-- Card 5: TV & Cars -->
  <g transform="translate(440,270)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="#642f7f" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <rect x="34" y="35" width="32" height="18" rx="3" fill="none" stroke="#642f7f" stroke-width="1.2"/>
    <line x1="46" y1="55" x2="46" y2="59" stroke="#642f7f" stroke-width="1"/>
    <line x1="42" y1="59" x2="50" y2="59" stroke="#642f7f" stroke-width="1"/>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Next-Gen TV &amp; Smart Cars</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Micro-LED 100"+, Dolby Vision 2,</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">and semi-autonomous driving</text>
    <rect x="90" y="85" width="60" height="20" rx="10" fill="#642f7f" opacity="0.12"/>
    <text x="120" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#642f7f" font-weight="500">Connected</text>
  </g>

  <!-- Card 6: Wellness -->
  <g transform="translate(800,270)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#161b22" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.9"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6"/>
    <path d="M50,55 L50,35" stroke="#e0304e" stroke-width="2" stroke-linecap="round"/>
    <path d="M50,35 Q40,35 40,42 Q40,48 50,55 Q60,48 60,42 Q60,35 50,35" fill="none" stroke="#e0304e" stroke-width="1.5"/>
    <circle cx="50" cy="35" r="2" fill="#e0304e" opacity="0.6">
      <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="38" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Wellness &amp; Health Tech</text>
    <text x="90" y="56" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Preventive health monitoring,</text>
    <text x="90" y="70" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">smart mirrors, and AI personalization</text>
    <rect x="90" y="85" width="80" height="20" rx="10" fill="#e0304e" opacity="0.12"/>
    <text x="130" y="99" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#e0304e" font-weight="500">Preventive</text>
  </g>

  <!-- Bottom connector line -->
  <line x1="200" y1="440" x2="1000" y2="440" stroke="url(#accentGrad)" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>

  <!-- Bottom insight -->
  <g transform="translate(600,480)">
    <rect x="-200" y="-18" width="400" height="36" rx="18" fill="#161b22" stroke="#642f7f" stroke-width="1" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">AI is the common thread — powering every trend on this list</text>
  </g>

  <!-- Animated dots connecting cards -->
  <circle cx="400" cy="165" r="2" fill="#642f7f" opacity="0.4">
    <animate attributeName="cx" values="400;440" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="165" r="2" fill="#e0304e" opacity="0.4">
    <animate attributeName="cx" values="760;800" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="335" r="2" fill="#e0304e" opacity="0.4">
    <animate attributeName="cx" values="400;440" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="335" r="2" fill="#642f7f" opacity="0.4">
    <animate attributeName="cx" values="760;800" dur="2.9s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(600,570)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#484f58" font-weight="500" letter-spacing="2">FARISIUM</text>
  </g>
</svg>

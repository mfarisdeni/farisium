<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-16} }
      @keyframes scan { 0%{transform:translateY(-200px)} 100%{transform:translateY(200px)} }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .float { animation: float 3.5s ease-in-out infinite; }
      .dash { stroke-dasharray: 6 3; animation: dash 1.5s linear infinite; }
      .scan-line { animation: scan 3s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="280" cy="200" rx="280" ry="220" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="920" cy="430" rx="260" ry="200" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left side: User profile being analyzed -->
  <g class="float">
    <!-- Profile card -->
    <rect x="120" y="180" width="320" height="300" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="120" y="180" width="320" height="120" rx="16" fill="url(#accent)" opacity="0.15"/>
    
    <!-- Avatar -->
    <circle cx="280" cy="240" r="45" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse"/>
    <circle cx="280" cy="240" r="28" fill="#161b22"/>
    <text x="280" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#accent)">👤</text>
    
    <!-- Scanning line -->
    <rect x="140" y="240" width="280" height="2" fill="url(#accent)" class="scan-line" opacity="0.7"/>
    
    <!-- Data points -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">
      <text x="160" y="320">Birthdate: 2010-03-15</text>
      <text x="160" y="345">Sessions/day: 8.2</text>
      <text x="160" y="370">Avg session: 12m</text>
      <text x="160" y="395">Topics: homework, games</text>
      <text x="160" y="420">Tone: casual, curious</text>
      <text x="160" y="445">Devices: phone, laptop</text>
    </g>
    
    <!-- Age prediction result -->
    <rect x="160" y="470" width="240" height="50" rx="8" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
    <text x="280" y="495" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">
      Predicted Age: 16.4 years ⚠️
    </text>
  </g>

  <!-- Center: AI brain processing -->
  <g class="float" filter="url(#blur2)">
    <circle cx="600" cy="315" r="80" fill="url(#glow1)" filter="url(#blur1)"/>
    <circle cx="600" cy="315" r="65" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse"/>
    <circle cx="600" cy="315" r="45" fill="#0a0a0f" opacity="0.9"/>
    
    <!-- Neural network inside -->
    <g stroke="url(#accent)" stroke-width="1.5" opacity="0.6">
      <line x1="570" y1="295" x2="600" y2="315"/>
      <line x1="600" y1="270" x2="600" y2="315"/>
      <line x1="630" y1="295" x2="600" y2="315"/>
      <line x1="570" y1="335" x2="600" y2="315"/>
      <line x1="600" y1="360" x2="600" y2="315"/>
      <line x1="630" y1="335" x2="600" y2="315"/>
    </g>
    
    <!-- Core -->
    <circle cx="600" cy="315" r="12" fill="url(#accent)" class="pulse"/>
    <text x="600" y="319" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#0a0a0f">AI</text>
  </g>

  <!-- Right side: Decision outcome -->
  <g class="float" style="animation-delay: 0.5s;">
    <!-- Decision card -->
    <rect x="760" y="180" width="320" height="300" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="760" y="180" width="320" height="120" rx="16" fill="#e0304e" opacity="0.15"/>
    
    <!-- Warning icon -->
    <circle cx="920" cy="240" r="45" fill="none" stroke="#e0304e" stroke-width="2" class="pulse"/>
    <circle cx="920" cy="240" r="28" fill="#161b22"/>
    <path d="M920,215 V245 M920,255 V260" stroke="#e0304e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Decision output -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">
      <text x="800" y="320">Signals analyzed: 247</text>
      <text x="800" y="345">Confidence: 87%</text>
      <text x="800" y="370">Default: TEEN MODE</text>
      <text x="800" y="395">Reason: usage pattern</text>
      <text x="800" y="420">Fallback: safer mode</text>
    </g>
    
    <!-- Action badge -->
    <rect x="800" y="470" width="240" height="50" rx="8" fill="#e0304e" opacity="0.2" stroke="#e0304e" stroke-width="1"/>
    <text x="920" y="495" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0304e">
      → Teen Protections ACTIVE
    </text>
  </g>

  <!-- Flow arrows -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.5" class="dash">
    <path d="M440,330 Q520,330 520,315" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M680,315 Q760,315 760,330" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#accent)" />
    </marker>
  </defs>

  <!-- Labels -->
  <text x="280" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b949e" letter-spacing="1">USER SIGNALS</text>
  <text x="600" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b949e" letter-spacing="1">AGE PREDICTION MODEL</text>
  <text x="920" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b949e" letter-spacing="1">DECISION OUTPUT</text>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="0.5">
    HOW AGE PREDICTION WORKS
  </text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">
    BEHAVIORAL SIGNALS > SELF-REPORTED AGE
  </text>

  <!-- Accent line -->
  <rect x="550" y="575" width="100" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="1170" height="600" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.05" stroke-width="1"/>

  <!-- FARISIUM branding -->
  <text x="50" y="605" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8b949e" opacity="0.4" letter-spacing="2">FARISIUM</text>
</svg>
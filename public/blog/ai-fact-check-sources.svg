<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-16}}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.5s linear infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="350" cy="300" rx="300" ry="180" fill="url(#glow-r)" filter="url(#blur)"/>
  <ellipse cx="900" cy="300" rx="280" ry="170" fill="url(#glow-g)" filter="url(#blur)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" letter-spacing="2">EVIDENCE HIERARCHY</text>
  <text x="600" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e" letter-spacing="2">NOT ALL SOURCES ARE EQUAL</text>

  <!-- Pyramid: Top = Primary -->
  <g filter="url(#shadow)">
    <polygon points="600,105 720,185 480,185" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="600" y="148" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#3fb950">PRIMARY</text>
    <text x="600" y="166" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Official docs, filings</text>
  </g>

  <!-- Pyramid: Middle = Secondary -->
  <g filter="url(#shadow)">
    <polygon points="480,190 720,190 800,260 400,260" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
    <text x="600" y="222" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#f0883e">SECONDARY</text>
    <text x="600" y="240" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Reviews, summaries, news</text>
  </g>

  <!-- Pyramid: Bottom = Community -->
  <g filter="url(#shadow)">
    <polygon points="400,265 800,265 900,340 300,340" fill="#161b22" stroke="#e0304e" stroke-width="1"/>
    <text x="600" y="297" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e0304e">COMMUNITY</text>
    <text x="600" y="315" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Forums, social, AI output</text>
  </g>

  <!-- Arrow down label -->
  <text x="600" y="365" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" letter-spacing="1">WEAKER EVIDENCE</text>
  <line x1="600" y1="350" x2="600" y2="370" stroke="#8b949e" stroke-width="1.5" marker-end="none"/>
  <polygon points="596,370 604,370 600,376" fill="#8b949e"/>

  <!-- Right side: Claim Types -->
  <text x="920" y="120" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e0304e" letter-spacing="1">CLAIM TYPES</text>

  <g filter="url(#shadow)">
    <rect x="650" y="135" width="500" height="55" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.8"/>
    <circle cx="680" cy="162" r="10" fill="#0a0a0f" stroke="#3fb950" stroke-width="1.2"/>
    <text x="680" y="166" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">F</text>
    <text x="700" y="158" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Fact</text>
    <text x="700" y="173" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Verifiable against evidence</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="200" width="500" height="55" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="0.8"/>
    <circle cx="680" cy="227" r="10" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.2"/>
    <text x="680" y="231" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#f0883e">O</text>
    <text x="700" y="223" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Opinion</text>
    <text x="700" y="238" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Recommendation or judgment</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="265" width="500" height="55" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8"/>
    <circle cx="680" cy="292" r="10" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.2"/>
    <text x="680" y="296" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#e0304e">P</text>
    <text x="700" y="288" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Prediction</text>
    <text x="700" y="303" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">What may happen — not a fact</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="330" width="500" height="55" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="0.8"/>
    <circle cx="680" cy="357" r="10" fill="#0a0a0f" stroke="#8b949e" stroke-width="1.2"/>
    <text x="680" y="361" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#8b949e">U</text>
    <text x="700" y="353" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Uncertain</text>
    <text x="700" y="368" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Insufficient evidence to conclude</text>
  </g>

  <!-- Bottom section: Red flags -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="1.5" opacity="0.6">RED FLAGS IN AI ANSWERS</text>

  <g filter="url(#shadow)">
    <rect x="60" y="435" width="260" height="55" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8" opacity="0.85"/>
    <circle cx="90" cy="462" r="10" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.2"/>
    <text x="90" y="466" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0304e">!</text>
    <text x="110" y="458" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Unsupported statistics</text>
    <text x="110" y="473" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Numbers without sources</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="340" y="435" width="260" height="55" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="0.8" opacity="0.85"/>
    <circle cx="370" cy="462" r="10" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.2"/>
    <text x="370" y="466" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0883e">!</text>
    <text x="390" y="458" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Outdated information</text>
    <text x="390" y="473" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Old data as current</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="435" width="260" height="55" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8" opacity="0.85"/>
    <circle cx="650" cy="462" r="10" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.2"/>
    <text x="650" y="466" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#642f7f">!</text>
    <text x="670" y="458" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Fabricated citations</text>
    <text x="670" y="473" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">References that do not exist</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="435" width="260" height="55" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.8" opacity="0.85"/>
    <circle cx="930" cy="462" r="10" fill="#0a0a0f" stroke="#3fb950" stroke-width="1.2"/>
    <text x="930" y="466" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950">!</text>
    <text x="950" y="458" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Overconfident tone</text>
    <text x="950" y="473" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Prediction stated as fact</text>
  </g>

  <!-- Bottom banner -->
  <rect x="250" y="510" width="700" height="55" rx="10" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.9"/>
  <text x="600" y="534" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">The goal is not perfection. It is knowing what you can trust.</text>
  <text x="600" y="552" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Separate facts from opinions. Verify what matters. Score your confidence.</text>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>

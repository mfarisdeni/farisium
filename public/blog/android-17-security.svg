<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.5s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="300" ry="250" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="50" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">THEFT PROTECTION: THREE LAYERS OF DEFENSE</text>

  <g filter="url(#sh)" transform="translate(90,200)">
    <rect x="0" y="0" width="330" height="210" rx="10" fill="#161b22" stroke="#3DDC84" stroke-width="1" opacity="0.92"/>
    <circle cx="46" cy="36" r="18" fill="#0a0a0f" stroke="#3DDC84" stroke-width="1.5"/>
    <text x="46" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#3DDC84">1</text>
    <text x="76" y="34" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Theft Detection Lock</text>
    <text x="76" y="52" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">On by default</text>
    <line x1="22" y1="72" x2="308" y2="72" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="94" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#e6edf3">AI detects phones being snatched</text>
    <text x="22" y="112" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#e6edf3">from your hand, then:</text>
    <circle cx="26" cy="140" r="4" fill="#3DDC84" class="pulse"/>
    <text x="38" y="144" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Locks the screen immediately</text>
    <circle cx="26" cy="166" r="4" fill="#3DDC84" class="pulse"/>
    <text x="38" y="170" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Trusted zones on by default</text>
    <circle cx="26" cy="192" r="4" fill="#3DDC84" class="pulse"/>
    <text x="38" y="196" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Stops data migration abuse</text>
  </g>

  <g filter="url(#sh)" transform="translate(435,200)">
    <rect x="0" y="0" width="330" height="210" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1" opacity="0.92"/>
    <circle cx="46" cy="36" r="18" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.5"/>
    <text x="46" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#f0883e">2</text>
    <text x="76" y="34" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Remote Lock</text>
    <text x="76" y="52" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">From any device</text>
    <line x1="22" y1="72" x2="308" y2="72" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="94" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#e6edf3">Call or go to android.com/lock</text>
    <text x="22" y="112" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#e6edf3">and confirm your phone number:</text>
    <circle cx="26" cy="140" r="4" fill="#f0883e" class="pulse"/>
    <text x="38" y="144" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Phone locks in seconds</text>
    <circle cx="26" cy="166" r="4" fill="#f0883e" class="pulse"/>
    <text x="38" y="170" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Anti-tampering hardened</text>
    <circle cx="26" cy="192" r="4" fill="#f0883e" class="pulse"/>
    <text x="38" y="196" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Works even after screen lock</text>
  </g>

  <g filter="url(#sh)" transform="translate(780,200)">
    <rect x="0" y="0" width="330" height="210" rx="10" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.92"/>
    <circle cx="46" cy="36" r="18" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.5"/>
    <text x="46" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e0304e">3</text>
    <text x="76" y="34" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Mark as Lost</text>
    <text x="76" y="52" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">In Find My Device</text>
    <line x1="22" y1="72" x2="308" y2="72" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="94" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#e6edf3">Biometrics on your device:</text>
    <circle cx="26" cy="140" r="4" fill="#e0304e" class="pulse"/>
    <text x="38" y="144" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Hides Quick Settings</text>
    <circle cx="26" cy="166" r="4" fill="#e0304e" class="pulse"/>
    <text x="38" y="170" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Blocks new Wi-Fi / Bluetooth</text>
    <circle cx="26" cy="192" r="4" fill="#e0304e" class="pulse"/>
    <text x="38" y="196" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#c9d1d9">Passcode holders are locked out</text>
  </g>

  <rect x="0" y="452" width="1200" height="1" fill="#3DDC84" opacity="0.12"/>

  <g filter="url(#sh)" transform="translate(250,480)">
    <rect x="0" y="0" width="700" height="66" rx="8" fill="#161b22" stroke="#3DDC84" stroke-width="1" opacity="0.6"/>
    <text x="24" y="20" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">PIN / Password attempts now strictly limited</text>
    <text x="24" y="40" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e">Fewer guesses allowed before the device requests a break — brute-force theft becomes impractical.</text>
    <text x="24" y="56" font-family="monospace" font-size="9" font-weight="700" fill="#3DDC84">BRUTE-FORCE RESISTANT</text>
  </g>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
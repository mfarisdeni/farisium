<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#100518" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e" />
      <stop offset="50%" stop-color="#7d4a96" />
      <stop offset="100%" stop-color="#e0304e" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="300" cy="200" r="150" fill="rgba(224,48,78,0.08)" filter="url(#glowStrong)" />
  <circle cx="800" cy="400" r="120" fill="rgba(125,74,150,0.08)" filter="url(#glowStrong)" />
  <!-- Central illustration: monitor/book icon -->
  <g transform="translate(350, 150)">
    <!-- Screen -->
    <rect x="0" y="0" width="220" height="160" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Screen content -->
    <rect x="20" y="20" width="180" height="8" rx="4" fill="rgba(224,48,78,0.4)" />
    <rect x="20" y="38" width="120" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="52" width="150" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="66" width="100" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="88" width="180" height="8" rx="4" fill="rgba(125,74,150,0.4)" />
    <rect x="20" y="106" width="140" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="120" width="160" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <!-- Screen glow -->
    <rect x="0" y="0" width="220" height="160" rx="12" fill="url(#accent)" opacity="0.03" />
  </g>
  <!-- Certificate badge -->
  <g transform="translate(620, 200)" filter="url(#glow)">
    <circle cx="60" cy="60" r="60" fill="url(#card)" stroke="rgba(224,48,78,0.15)" stroke-width="1"/>
    <circle cx="60" cy="60" r="45" fill="url(#accent)" opacity="0.1" stroke="rgba(224,48,78,0.2)" stroke-width="0.5"/>
    <!-- Checkmark -->
    <path d="M45 60 L55 70 L75 50" stroke="rgba(224,48,78,0.6)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Floating elements -->
  <g opacity="0.15">
    <rect x="280" y="420" width="80" height="24" rx="8" fill="rgba(125,74,150,0.3)" />
    <rect x="660" y="140" width="60" height="20" rx="6" fill="rgba(224,48,78,0.3)" />
    <rect x="400" y="450" width="100" height="20" rx="6" fill="rgba(255,255,255,0.05)" />
  </g>
  <!-- Bottom gradient line -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.3" />
  <!-- Logo area -->
  <g transform="translate(530, 560)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.15)" text-anchor="middle" letter-spacing="4">FARISIUM</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="tutor-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-14} }
      @keyframes typing { 0%{width:0} 50%{width:100%} 100%{width:0} }
      @keyframes stepPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .float { animation: float 3.5s ease-in-out infinite; }
      .dash { stroke-dasharray: 6 3; animation: dash 1.5s linear infinite; }
      .step-active { animation: stepPulse 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="250" cy="280" rx="300" ry="240" fill="url(#tutor-glow)" filter="url(#blur1)"/>
  <ellipse cx="950" cy="350" rx="280" ry="220" fill="url(#tutor-glow)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left: Regular ChatGPT (Direct Answer) -->
  <g class="float">
    <rect x="80" y="180" width="420" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="80" y="180" width="420" height="70" rx="16" fill="#e0304e" opacity="0.12"/>
    
    <!-- Header -->
    <text x="120" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">💬 REGULAR MODE</text>
    <text x="440" y="225" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e0304e" opacity="0.7">⚡ INSTANT ANSWER</text>
    
    <!-- Chat bubbles -->
    <!-- User question -->
    <rect x="120" y="260" width="340" height="50" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="140" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e6edf3">"What's the derivative of x² + 3x?"</text>
    
    <!-- AI answer - direct -->
    <rect x="120" y="330" width="340" height="120" rx="12" fill="url(#accent)" opacity="0.1" stroke="url(#accent)" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">
      <text x="140" y="355"><tspan font-weight="600" fill="#e0304e">Answer:</tspan> 2x + 3</text>
      <text x="140" y="375">The derivative of x² is 2x,</text>
      <text x="140" y="395">and the derivative of 3x is 3.</text>
      <text x="140" y="415">So the answer is 2x + 3.</text>
    </g>
    
    <!-- Label -->
    <rect x="120" y="465" width="140" height="28" rx="6" fill="#e0304e" opacity="0.2" stroke="#e0304e" stroke-width="1"/>
    <text x="190" y="483" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#e0304e">DONE ⚡</text>
  </g>

  <!-- Center: Transformation Arrow -->
  <g class="float" style="animation-delay: 0.3s;">
    <path d="M550,320 Q600,300 650,320" fill="none" stroke="url(#accent)" stroke-width="3" class="dash" marker-end="url(#arrow-main)"/>
    <circle cx="600" cy="290" r="28" fill="url(#accent)" opacity="0.15"/>
    <circle cx="600" cy="290" r="18" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse"/>
    <text x="600" y="295" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="url(#accent)">→</text>
    <text x="600" y="355" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="1">STUDY MODE</text>
  </g>
  
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="url(#accent)" />
    </marker>
  </defs>

  <!-- Right: Study Mode (Guided Steps) -->
  <g class="float" style="animation-delay: 0.5s;">
    <rect x="700" y="180" width="420" height="320" rx="16" fill="#161b22" stroke="#642f7f" stroke-width="1.5"/>
    <rect x="700" y="180" width="420" height="70" rx="16" fill="#642f7f" opacity="0.15"/>
    
    <!-- Header -->
    <text x="740" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">🎓 STUDY MODE</text>
    <text x="1060" y="225" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#642f7f">📚 GUIDED LEARNING</text>
    
    <!-- Chat bubbles - Step by step -->
    <!-- User question -->
    <rect x="740" y="260" width="340" height="50" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="760" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e6edf3">"What's the derivative of x² + 3x?"</text>
    
    <!-- Step 1 -->
    <rect x="740" y="325" width="340" height="55" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1.5" class="step-active" style="animation-delay: 0s"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11">
      <text x="755" y="345" font-weight="600" fill="#642f7f">Step 1:</text>
      <text x="810" y="345" fill="#8b949e">What rule do you use for x²?</text>
      <text x="755" y="365" fill="#e6edf3">▸ Power rule: d/dx(xⁿ) = n·xⁿ⁻¹</text>
    </g>
    
    <!-- Step 2 -->
    <rect x="740" y="390" width="340" height="55" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" class="step-active" style="animation-delay: 0.5s"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11">
      <text x="755" y="410" font-weight="600" fill="#642f7f">Step 2:</text>
      <text x="810" y="410" fill="#8b949e">Apply to x²: n=2, so 2·x¹ = 2x</text>
      <text x="755" y="430" fill="#8b949e">Now what about 3x?</text>
    </g>
    
    <!-- Step 3 -->
    <rect x="740" y="455" width="340" height="55" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" class="step-active" style="animation-delay: 1s"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11">
      <text x="755" y="475" font-weight="600" fill="#642f7f">Step 3:</text>
      <text x="810" y="475" fill="#8b949e">Derivative of 3x is 3 (constant × x)</text>
      <text x="755" y="495" fill="#e6edf3"><tspan font-weight="600" fill="#642f7f">Final: 2x + 3 ✓</tspan></text>
    </g>
    
    <!-- Label -->
    <rect x="740" y="520" width="160" height="28" rx="6" fill="#642f7f" opacity="0.2" stroke="#642f7f" stroke-width="1"/>
    <text x="820" y="538" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#642f7f">LEARNED ✓</text>
  </g>

  <!-- Bottom: Key difference summary -->
  <g opacity="0.6">
    <rect x="200" y="530" width="360" height="70" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.5"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">
      <text x="220" y="550" font-weight="600" fill="#e0304e">Regular:</text>
      <text x="290" y="550">Gives answer → Student copies</text>
      <text x="220" y="570" font-weight="600" fill="#e0304e">Result:</text>
      <text x="290" y="570">Passive learning, no retention</text>
    </g>
    
    <rect x="640" y="530" width="360" height="70" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1" opacity="0.5"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">
      <text x="660" y="550" font-weight="600" fill="#642f7f">Study Mode:</text>
      <text x="750" y="550">Asks questions → Student thinks</text>
      <text x="660" y="570" font-weight="600" fill="#642f7f">Result:</text>
      <text x="750" y="570">Active learning, builds understanding</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="0.5">
    STUDY MODE: TUTOR VS ANSWER KEY
  </text>

  <!-- Accent line -->
  <rect x="550" y="575" width="100" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="1170" height="600" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.05" stroke-width="1"/>

  <!-- FARISIUM branding -->
  <text x="50" y="605" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8b949e" opacity="0.4" letter-spacing="2">FARISIUM</text>
</svg>
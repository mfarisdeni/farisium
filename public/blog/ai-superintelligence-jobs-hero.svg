<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes floatR { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-24} }
      @keyframes dotFlow { 0%{offset-distance:0%; opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%; opacity:0} }
      @keyframes scaleBar { 0%,100%{transform:scaleY(0.5)} 50%{transform:scaleY(1)} }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .float-r { animation: floatR 4s ease-in-out infinite; }
      .dash { stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
      .bar { transform-origin: center bottom; animation: scaleBar 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="320" cy="300" rx="300" ry="240" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="880" cy="330" rx="280" ry="230" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left: human worker icon -->
  <g class="float">
    <circle cx="330" cy="270" r="95" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.35"/>
    <circle cx="330" cy="270" r="110" fill="none" stroke="#e0304e" stroke-width="0.75" stroke-dasharray="4 10" opacity="0.25" class="pulse"/>
    <!-- person: head + shoulders -->
    <circle cx="330" cy="242" r="26" fill="none" stroke="#f0f6fc" stroke-width="3"/>
    <path d="M284,330 Q284,288 330,288 Q376,288 376,330" fill="none" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round"/>
    <!-- label -->
    <rect x="278" y="392" width="104" height="30" rx="15" fill="#e0304e" fill-opacity="0.12" stroke="#e0304e" stroke-width="1" stroke-opacity="0.5"/>
    <text x="330" y="412" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ff6b81" text-anchor="middle" letter-spacing="2">HUMAN</text>
    <!-- small bars (skills) under label -->
    <g fill="#e0304e" opacity="0.7">
      <rect class="bar" x="296" y="452" width="12" height="26" rx="3" style="animation-delay:0s" transform-origin="302px 478px"/>
      <rect class="bar" x="316" y="442" width="12" height="36" rx="3" style="animation-delay:0.3s" transform-origin="322px 478px"/>
      <rect class="bar" x="336" y="448" width="12" height="30" rx="3" style="animation-delay:0.6s" transform-origin="342px 478px"/>
      <rect class="bar" x="356" y="436" width="12" height="42" rx="3" style="animation-delay:0.9s" transform-origin="362px 478px"/>
    </g>
  </g>

  <!-- Right: AI core icon -->
  <g class="float-r">
    <circle cx="870" cy="270" r="95" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.35"/>
    <circle cx="870" cy="270" r="110" fill="none" stroke="#642f7f" stroke-width="0.75" stroke-dasharray="4 10" opacity="0.25" class="pulse"/>
    <!-- chip -->
    <rect x="822" y="222" width="96" height="96" rx="14" fill="none" stroke="#c9a7ee" stroke-width="3"/>
    <rect x="846" y="246" width="48" height="48" rx="8" fill="url(#accent)" fill-opacity="0.25" stroke="#c9a7ee" stroke-width="1.5"/>
    <!-- chip pins -->
    <g stroke="#c9a7ee" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="838" y1="206" x2="838" y2="222"/><line x1="862" y1="206" x2="862" y2="222"/>
      <line x1="886" y1="206" x2="886" y2="222"/><line x1="910" y1="206" x2="910" y2="222"/>
      <line x1="838" y1="318" x2="838" y2="334"/><line x1="862" y1="318" x2="862" y2="334"/>
      <line x1="886" y1="318" x2="886" y2="334"/><line x1="910" y1="318" x2="910" y2="334"/>
      <line x1="806" y1="238" x2="822" y2="238"/><line x1="806" y1="262" x2="822" y2="262"/>
      <line x1="806" y1="286" x2="806" y2="286"/><line x1="806" y1="310" x2="822" y2="310"/>
      <line x1="918" y1="238" x2="934" y2="238"/><line x1="918" y1="262" x2="934" y2="262"/>
      <line x1="918" y1="286" x2="934" y2="286"/><line x1="918" y1="310" x2="934" y2="310"/>
    </g>
    <!-- label -->
    <rect x="820" y="392" width="100" height="30" rx="15" fill="#642f7f" fill-opacity="0.2" stroke="#642f7f" stroke-width="1" stroke-opacity="0.7"/>
    <text x="870" y="412" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#c9a7ee" text-anchor="middle" letter-spacing="2">AI</text>
    <!-- neural nodes under label -->
    <g class="pulse">
      <circle cx="846" cy="462" r="4" fill="#642f7f"/>
      <circle cx="870" cy="452" r="5" fill="#e0304e"/>
      <circle cx="894" cy="462" r="4" fill="#642f7f"/>
      <path d="M846,462 L870,452 L894,462" fill="none" stroke="#642f7f" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- Center connection: data flow lines -->
  <g filter="url(#blur2)">
    <line x1="430" y1="250" x2="770" y2="250" stroke="url(#accent)" stroke-width="2" class="dash" opacity="0.7"/>
    <line x1="430" y1="290" x2="770" y2="290" stroke="url(#accent)" stroke-width="2" class="dash" opacity="0.7" style="animation-direction:reverse"/>
    <circle cx="600" cy="250" r="5" fill="#e0304e" class="pulse"/>
    <circle cx="600" cy="290" r="5" fill="#642f7f" class="pulse" style="animation-delay:1s"/>
  </g>

  <!-- Center question mark badge -->
  <g class="float">
    <circle cx="600" cy="200" r="26" fill="#0d1117" stroke="url(#accent)" stroke-width="2" filter="url(#blur2)"/>
    <text x="600" y="210" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f0f6fc" text-anchor="middle">?</text>
  </g>

  <!-- Title -->
  <text x="600" y="540" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#f0f6fc" text-anchor="middle" letter-spacing="1">AI &amp; THE FUTURE OF WORK</text>
  <text x="600" y="574" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#8b949e" text-anchor="middle" letter-spacing="3">WHICH JOBS ARE AT RISK — AND WHICH ARE SAFER</text>

  <!-- Brand -->
  <text x="600" y="610" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#e0304e" text-anchor="middle" letter-spacing="4" class="pulse">FARISIUM.COM</text>
</svg>

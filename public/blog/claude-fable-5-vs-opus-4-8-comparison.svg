<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes barGrow { from { width: 0; } }
    @keyframes barGrowReverse { from { width: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .title { animation: fadeIn 0.6s ease-out forwards; }
    .row { animation: fadeIn 0.5s ease-out forwards; }
    .row:nth-child(2) { animation-delay: 0.1s; opacity: 0; animation-fill-mode: forwards; }
    .row:nth-child(3) { animation-delay: 0.2s; opacity: 0; animation-fill-mode: forwards; }
    .row:nth-child(4) { animation-delay: 0.3s; opacity: 0; animation-fill-mode: forwards; }
    .row:nth-child(5) { animation-delay: 0.4s; opacity: 0; animation-fill-mode: forwards; }
    .row:nth-child(6) { animation-delay: 0.5s; opacity: 0; animation-fill-mode: forwards; }
    .bar-left { animation: barGrow 1s ease-out 0.6s forwards; width: 0; }
    .bar-right { animation: barGrowReverse 1s ease-out 0.6s forwards; width: 0; }
    .bar-left.animate { }
    .bar-right.animate { }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111118;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Title -->
  <g class="title">
    <text x="600" y="60" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">Claude Fable 5 vs Opus 4.8</text>
    <text x="600" y="88" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400">Latest Claude Model Comparison</text>
  </g>

  <!-- Divider -->
  <line x1="600" y1="110" x2="600" y2="580" stroke="#1f1f2e" stroke-width="1" stroke-dasharray="4,4" class="pulse"/>

  <!-- Column Headers -->
  <g class="row" style="animation-delay:0.1s">
    <rect x="80" y="120" width="440" height="50" rx="10" fill="#3b82f6" opacity="0.1"/>
    <circle cx="110" cy="145" r="8" fill="#3b82f6"/>
    <text x="130" y="150" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Claude Fable 5</text>

    <rect x="680" y="120" width="440" height="50" rx="10" fill="#dc2626" opacity="0.1"/>
    <circle cx="710" cy="145" r="8" fill="#dc2626"/>
    <text x="730" y="150" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Claude Opus 4.8</text>
  </g>

  <!-- Row 1: Kecepatan -->
  <g class="row" style="animation-delay:0.15s">
    <text x="600" y="215" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1" text-transform="uppercase">SPEED</text>
    <!-- Fable 5 -->
    <rect x="80" y="230" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="80" y="230" width="370" height="28" rx="6" fill="#3b82f6" opacity="0.8">
      <animate attributeName="width" from="0" to="370" dur="0.8s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="455" y="249" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">85%</text>
    <!-- Opus 4.8 -->
    <rect x="680" y="230" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="680" y="230" width="280" height="28" rx="6" fill="#dc2626" opacity="0.8">
      <animate attributeName="width" from="0" to="280" dur="0.8s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="965" y="249" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">64%</text>
  </g>

  <!-- Row 2: Kreativitas -->
  <g class="row" style="animation-delay:0.2s">
    <text x="600" y="295" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CREATIVITY</text>
    <rect x="80" y="310" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="80" y="310" width="330" height="28" rx="6" fill="#3b82f6" opacity="0.8">
      <animate attributeName="width" from="0" to="330" dur="0.8s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="415" y="329" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">75%</text>
    <rect x="680" y="310" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="680" y="310" width="400" height="28" rx="6" fill="#dc2626" opacity="0.8">
      <animate attributeName="width" from="0" to="400" dur="0.8s" begin="0.9s" fill="freeze"/>
    </rect>
    <text x="1085" y="329" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">91%</text>
  </g>

  <!-- Row 3: Coding -->
  <g class="row" style="animation-delay:0.25s">
    <text x="600" y="375" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CODING</text>
    <rect x="80" y="390" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="80" y="390" width="400" height="28" rx="6" fill="#3b82f6" opacity="0.8">
      <animate attributeName="width" from="0" to="400" dur="0.8s" begin="1.0s" fill="freeze"/>
    </rect>
    <text x="485" y="409" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">91%</text>
    <rect x="680" y="390" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="680" y="390" width="380" height="28" rx="6" fill="#dc2626" opacity="0.8">
      <animate attributeName="width" from="0" to="380" dur="0.8s" begin="1.1s" fill="freeze"/>
    </rect>
    <text x="1065" y="409" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">86%</text>
  </g>

  <!-- Row 4: Analisis -->
  <g class="row" style="animation-delay:0.3s">
    <text x="600" y="455" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">ANALYSIS</text>
    <rect x="80" y="470" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="80" y="470" width="350" height="28" rx="6" fill="#3b82f6" opacity="0.8">
      <animate attributeName="width" from="0" to="350" dur="0.8s" begin="1.2s" fill="freeze"/>
    </rect>
    <text x="435" y="489" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">80%</text>
    <rect x="680" y="470" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="680" y="470" width="420" height="28" rx="6" fill="#dc2626" opacity="0.8">
      <animate attributeName="width" from="0" to="420" dur="0.8s" begin="1.3s" fill="freeze"/>
    </rect>
    <text x="1105" y="489" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">95%</text>
  </g>

  <!-- Row 5: Harga -->
  <g class="row" style="animation-delay:0.35s">
    <text x="600" y="535" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">PRICE (VALUE)</text>
    <rect x="80" y="550" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="80" y="550" width="410" height="28" rx="6" fill="#3b82f6" opacity="0.8">
      <animate attributeName="width" from="0" to="410" dur="0.8s" begin="1.4s" fill="freeze"/>
    </rect>
    <text x="495" y="569" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">93%</text>
    <rect x="680" y="550" width="440" height="28" rx="6" fill="#1a1a2e"/>
    <rect x="680" y="550" width="260" height="28" rx="6" fill="#dc2626" opacity="0.8">
      <animate attributeName="width" from="0" to="260" dur="0.8s" begin="1.5s" fill="freeze"/>
    </rect>
    <text x="945" y="569" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">59%</text>
  </g>

  <!-- Bottom label -->
  <text x="600" y="610" text-anchor="middle" fill="#4b5563" font-family="Inter, system-ui, sans-serif" font-size="12">farisium.com</text>
</svg>
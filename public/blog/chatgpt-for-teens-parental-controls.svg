<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="safe-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-16} }
      @keyframes linkPulse { 0%,100%{stroke-opacity:0.3} 50%{stroke-opacity:0.8} }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .float { animation: float 3.5s ease-in-out infinite; }
      .dash { stroke-dasharray: 6 3; animation: dash 1.5s linear infinite; }
      .link-pulse { animation: linkPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="250" cy="280" rx="300" ry="240" fill="url(#safe-glow)" filter="url(#blur1)"/>
  <ellipse cx="950" cy="350" rx="280" ry="220" fill="url(#safe-glow)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Step 1: Parent Account -->
  <g class="float">
    <rect x="80" y="160" width="280" height="340" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="80" y="160" width="280" height="60" rx="16" fill="#238636" opacity="0.15"/>
    
    <text x="130" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#238636">STEP 1: PARENT ACCOUNT</text>
    
    <!-- Parent avatar -->
    <circle cx="220" cy="250" r="40" fill="none" stroke="#238636" stroke-width="2" class="pulse"/>
    <circle cx="220" cy="250" r="25" fill="#161b22"/>
    <text x="220" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#238636">👨‍👩‍👧</text>
    
    <text x="220" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Parent</text>
    <text x="220" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Opens Parental Controls</text>
    
    <!-- Action buttons -->
    <rect x="110" y="355" width="220" height="42" rx="8" fill="#238636" opacity="0.2" stroke="#238636" stroke-width="1.5"/>
    <text x="220" y="382" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#238636">Send Link Invitation 📧</text>
    
    <rect x="110" y="410" width="220" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="220" y="437" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Set Quiet Hours ⏰</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M360,300 Q420,300 420,315" fill="none" stroke="url(#accent)" stroke-width="2.5" class="dash link-pulse" marker-end="url(#arrow1)"/>
  
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#accent)" />
    </marker>
  </defs>

  <!-- Center: Link/Connection -->
  <g class="float" filter="url(#blur2)" style="animation-delay: 0.3s;">
    <!-- Connection hub -->
    <circle cx="600" cy="315" r="55" fill="url(#safe-glow)" filter="url(#blur1)"/>
    <circle cx="600" cy="315" r="42" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse"/>
    
    <!-- Link chain -->
    <g stroke="url(#accent)" stroke-width="2.5" fill="none" class="link-pulse">
      <path d="M565,315 Q585,315 585,300 Q585,285 600,285 Q615,285 615,300 Q615,315 635,315"/>
    </g>
    
    <circle cx="585" cy="315" r="8" fill="#238636" class="pulse"/>
    <circle cx="615" cy="315" r="8" fill="#e0304e" class="pulse" style="animation-delay: 0.5s"/>
    
    <text x="600" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b949e">EMAIL INVITATION</text>
    <text x="600" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8b949e">Teen must accept to activate</text>
    
    <text x="600" y="385" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="url(#accent)">⛓️ LINKED</text>
    <text x="600" y="405" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8b949e">Teen consent required</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M780,315 Q840,315 840,300" fill="none" stroke="url(#accent)" stroke-width="2.5" class="dash link-pulse" marker-end="url(#arrow2)"/>
  
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#accent)" />
    </marker>
  </defs>

  <!-- Step 2: Teen Account -->
  <g class="float" style="animation-delay: 0.5s;">
    <rect x="840" y="160" width="280" height="340" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="840" y="160" width="280" height="60" rx="16" fill="#e0304e" opacity="0.12"/>
    
    <text x="1090" y="195" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0304e">STEP 2: TEEN ACCOUNT</text>
    
    <!-- Teen avatar -->
    <circle cx="980" cy="250" r="40" fill="none" stroke="#e0304e" stroke-width="2" class="pulse" style="animation-delay: 0.5s"/>
    <circle cx="980" cy="250" r="25" fill="#161b22"/>
    <text x="980" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e0304e">👦</text>
    
    <text x="980" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Teen</text>
    <text x="980" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Accepts invitation ✓</text>
    
    <!-- Teen controls -->
    <rect x="870" y="355" width="220" height="42" rx="8" fill="#e0304e" opacity="0.2" stroke="#e0304e" stroke-width="1.5"/>
    <text x="980" y="382" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0304e">Accept Link 🤝</text>
    
    <rect x="870" y="410" width="220" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="980" y="437" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Auto: Teen Mode Active</text>
  </g>

  <!-- Bottom: Control Panel -->
  <rect x="200" y="520" width="800" height="85" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Control toggles -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11">
    <!-- Quiet Hours -->
    <rect x="230" y="535" width="180" height="55" rx="8" fill="#238636" opacity="0.1" stroke="#238636" stroke-width="1"/>
    <text x="245" y="553" font-weight="600" fill="#238636">🌙 Quiet Hours</text>
    <text x="245" y="570" fill="#8b949e">22:00 — 07:00 active</text>
    <rect x="370" y="550" width="50" height="28" rx="14" fill="#238636"/>
    <circle cx="406" cy="564" r="10" fill="#fff"/>
    
    <!-- Study Mode -->
    <rect x="440" y="535" width="180" height="55" rx="8" fill="#642f7f" opacity="0.1" stroke="#642f7f" stroke-width="1"/>
    <text x="455" y="553" font-weight="600" fill="#642f7f">📚 Study Mode</text>
    <text x="455" y="570" fill="#8b949e">Default: ON</text>
    <rect x="580" y="550" width="50" height="28" rx="14" fill="#642f7f"/>
    <circle cx="616" cy="564" r="10" fill="#fff"/>
    
    <!-- Memory/History -->
    <rect x="650" y="535" width="180" height="55" rx="8" fill="#e0304e" opacity="0.1" stroke="#e0304e" stroke-width="1"/>
    <text x="665" y="553" font-weight="600" fill="#e0304e">🧠 Memory</text>
    <text x="665" y="570" fill="#8b949e">Disabled by parent</text>
    <rect x="790" y="550" width="50" height="28" rx="14" fill="#30363d"/>
    <circle cx="794" cy="564" r="10" fill="#8b949e"/>
    
    <!-- Distress Alerts -->
    <rect x="860" y="535" width="180" height="55" rx="8" fill="#e0304e" opacity="0.1" stroke="#e0304e" stroke-width="1"/>
    <text x="875" y="553" font-weight="600" fill="#e0304e">🚨 Distress Alerts</text>
    <text x="875" y="570" fill="#8b949e">Enabled (acute only)</text>
    <rect x="1000" y="550" width="50" height="28" rx="14" fill="#e0304e"/>
    <circle cx="1036" cy="564" r="10" fill="#fff"/>
  </g>

  <!-- Privacy note -->
  <rect x="230" y="465" width="740" height="40" rx="8" fill="#e0304e" opacity="0.08" stroke="#e0304e" stroke-width="1" stroke-dasharray="4 4"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e0304e">
    <text x="600" y="485" text-anchor="middle" font-weight="600">🔒 PRIVACY: Parents CANNOT read chat content — only settings & acute distress notifications</text>
  </g>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="0.5">
    PARENTAL CONTROLS FLOW
  </text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">
    CONSENT-BASED • LIMITED OVERSIGHT • PRIVACY-PRESERVING
  </text>

  <!-- Accent line -->
  <rect x="550" y="575" width="100" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="1170" height="600" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.05" stroke-width="1"/>

  <!-- FARISIUM branding -->
  <text x="50" y="605" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8b949e" opacity="0.4" letter-spacing="2">FARISIUM</text>
</svg>
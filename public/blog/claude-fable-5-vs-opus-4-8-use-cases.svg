<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 6px rgba(59,130,246,0.3)); } 50% { filter: drop-shadow(0 0 14px rgba(59,130,246,0.5)); } }
    @keyframes glowRed { 0%, 100% { filter: drop-shadow(0 0 6px rgba(220,38,38,0.3)); } 50% { filter: drop-shadow(0 0 14px rgba(220,38,38,0.5)); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .title { animation: fadeIn 0.5s ease-out forwards; }
    .quad { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
    .quad:nth-child(2) { animation-delay: 0.15s; }
    .quad:nth-child(3) { animation-delay: 0.3s; }
    .quad:nth-child(4) { animation-delay: 0.45s; }
    .quad:nth-child(5) { animation-delay: 0.6s; }
    .icon-glow { animation: glow 3s ease-in-out infinite; }
    .icon-glow-red { animation: glowRed 3s ease-in-out infinite; }
    .float { animation: float 3s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <g class="title">
    <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">When to Use Fable 5 vs Opus 4.8?</text>
    <text x="600" y="82" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="14">Model Selection Guide Based on Use Case</text>
  </g>

  <!-- Quadrant 1: Menulis Konten (top-left) -->
  <g class="quad" style="animation-delay:0.15s">
    <rect x="50" y="110" width="530" height="230" rx="16" fill="#111118" stroke="#1e293b" stroke-width="1"/>
    <rect x="50" y="110" width="530" height="230" rx="16" fill="url(#blue-glow)" opacity="0.5"/>
    <!-- Pen icon -->
    <g transform="translate(90, 155)" class="float">
      <path d="M0 30 L10 0 L20 30 Z" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
      <line x1="10" y1="30" x2="10" y2="50" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="10" cy="52" r="2" fill="#3b82f6"/>
    </g>
    <text x="130" y="170" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Content Writing</text>
    <text x="130" y="195" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Fable 5</text>
    <text x="130" y="225" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Ideal for blogs, articles, copywriting.</text>
    <text x="130" y="248" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Faster and more cost-effective for</text>
    <text x="130" y="271" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">high-volume content.</text>
    <!-- Tags -->
    <rect x="130" y="290" width="80" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="170" y="306" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Blog</text>
    <rect x="220" y="290" width="90" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="265" y="306" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Artikel</text>
    <rect x="320" y="290" width="100" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="370" y="306" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Copywriting</text>
  </g>

  <!-- Quadrant 2: Coding & Debug (top-right) -->
  <g class="quad" style="animation-delay:0.3s">
    <rect x="620" y="110" width="530" height="230" rx="16" fill="#111118" stroke="#1e293b" stroke-width="1"/>
    <rect x="620" y="110" width="530" height="230" rx="16" fill="url(#red-glow)" opacity="0.5"/>
    <!-- Code icon -->
    <g transform="translate(660, 150)" class="float" style="animation-delay:0.5s">
      <text font-family="monospace" font-size="30" fill="#dc2626">&lt;/&gt;</text>
    </g>
    <text x="710" y="170" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Coding &amp; Debug</text>
    <text x="710" y="195" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Opus 4.8</text>
    <text x="710" y="225" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Complex code, debugging, architecture.</text>
    <text x="710" y="248" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Stronger reasoning for hard problems</text>
    <text x="710" y="271" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">and code review.</text>
    <rect x="710" y="290" width="75" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="747" y="306" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Debug</text>
    <rect x="795" y="290" width="85" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="837" y="306" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Architecture</text>
    <rect x="890" y="290" width="100" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="940" y="306" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Code Review</text>
  </g>

  <!-- Quadrant 3: Analisis Data (bottom-left) -->
  <g class="quad" style="animation-delay:0.45s">
    <rect x="50" y="370" width="530" height="220" rx="16" fill="#111118" stroke="#1e293b" stroke-width="1"/>
    <rect x="50" y="370" width="530" height="220" rx="16" fill="url(#red-glow)" opacity="0.3"/>
    <!-- Chart icon -->
    <g transform="translate(85, 410)" class="float" style="animation-delay:1s">
      <rect x="0" y="20" width="10" height="30" rx="2" fill="#dc2626" opacity="0.6"/>
      <rect x="14" y="10" width="10" height="40" rx="2" fill="#dc2626" opacity="0.8"/>
      <rect x="28" y="0" width="10" height="50" rx="2" fill="#dc2626"/>
    </g>
    <text x="130" y="425" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Data Analysis</text>
    <text x="130" y="450" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Opus 4.8</text>
    <text x="130" y="478" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Complex data, research, detailed reports.</text>
    <text x="130" y="501" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Deep reasoning for accurate</text>
    <text x="130" y="524" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">insights.</text>
    <rect x="130" y="544" width="90" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="175" y="560" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Research</text>
    <rect x="230" y="544" width="80" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="270" y="560" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Reports</text>
    <rect x="320" y="544" width="80" height="24" rx="12" fill="#dc2626" opacity="0.15"/>
    <text x="360" y="560" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Insights</text>
  </g>

  <!-- Quadrant 4: Kreativitas (bottom-right) -->
  <g class="quad" style="animation-delay:0.6s">
    <rect x="620" y="370" width="530" height="220" rx="16" fill="#111118" stroke="#1e293b" stroke-width="1"/>
    <rect x="620" y="370" width="530" height="220" rx="16" fill="url(#blue-glow)" opacity="0.3"/>
    <!-- Star icon -->
    <g transform="translate(665, 410)" class="float" style="animation-delay:1.5s">
      <polygon points="15,0 19,11 31,11 21,18 25,30 15,22 5,30 9,18 -1,11 11,11" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="710" y="425" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Kreativitas</text>
    <text x="710" y="450" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Fable 5</text>
    <text x="710" y="478" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">Brainstorming, creative ideas, narratives.</text>
    <text x="710" y="501" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">More natural and engaging responses</text>
    <text x="710" y="524" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13">for creative content.</text>
    <rect x="710" y="544" width="110" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="765" y="560" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Brainstorming</text>
    <rect x="830" y="544" width="80" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="870" y="560" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Narasi</text>
    <rect x="920" y="544" width="70" height="24" rx="12" fill="#3b82f6" opacity="0.15"/>
    <text x="955" y="560" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Ideas</text>
  </g>

  <!-- Footer -->
  <text x="600" y="618" text-anchor="middle" fill="#4b5563" font-family="Inter, system-ui, sans-serif" font-size="12">farisium.com</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="google" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#FBBC05"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-24}}
      @keyframes glowp{0%,100%{opacity:.35}50%{opacity:.9}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.2s linear infinite}
      .glowp{animation:glowp 3s ease-in-out infinite}
      .blink{animation:blink 1.5s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="420" ry="280" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="50" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">SAVE AN ITEM\u2019S LOCATION WITHOUT A TRACKER</text>

  <g transform="translate(560,320)" filter="url(#sh)">
    <rect x="-62" y="-105" width="124" height="210" rx="24" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <rect x="-50" y="-90" width="100" height="180" rx="10" fill="#0a0a0f"/>
    <rect x="0" y="-70" width="60" height="10" rx="5" fill="#21262d"/>
    <rect x="0" y="40" width="60" height="8" rx="4" fill="#21262d"/>
    <rect x="0" y="56" width="44" height="8" rx="4" fill="#21262d"/>
    <circle cx="0" cy="-40" r="20" fill="url(#google)" opacity="0.15"/>
    <circle cx="0" cy="-40" r="9" fill="url(#ai)" class="glowp"/>
    <text x="0" y="-37" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">G</text>
    <rect x="-34" y="4" width="68" height="5" rx="2.5" fill="#21262d"/>
    <rect x="-34" y="16" width="68" height="5" rx="2.5" fill="#21262d"/>
    <rect x="-34" y="28" width="40" height="5" rx="2.5" fill="#642f7f" class="pulse"/>
    <rect x="-45" y="88" width="90" height="5" rx="2.5" fill="#e0304e" opacity="0.5"/>
    <rect x="-45" y="100" width="90" height="5" rx="2.5" fill="#e0304e" opacity="0.35"/>
    <circle cx="0" cy="-52" r="3" fill="#4285F4" class="blink"/>
  </g>

  <g filter="url(#sh)" transform="translate(140,150)">
    <rect x="0" y="0" width="250" height="84" rx="8" fill="#161b22" stroke="#4285F4" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#4285F4" stroke-width="1.5"/>
    <path d="M20 31h16M31 20v16" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
    <text x="56" y="27" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Just talk or type</text>
    <text x="56" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">"Passport is in the top drawer"</text>
    <text x="12" y="66" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#4285F4">NO HARDWARE NEEDED</text>
  </g>
  <line x1="390" y1="192" x2="498" y2="240" stroke="#4285F4" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(810,150)">
    <rect x="0" y="0" width="250" height="84" rx="8" fill="#161b22" stroke="#34A853" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#34A853" stroke-width="1.5"/>
    <path d="M20 31l6 6 12-14" stroke="#34A853" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Saved as a note</text>
    <text x="56" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Find Hub + optional photo</text>
    <text x="12" y="66" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#34A853">STORED IN YOUR ACCOUNT</text>
  </g>
  <line x1="810" y1="192" x2="702" y2="240" stroke="#34A853" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(140,430)">
    <rect x="0" y="0" width="250" height="84" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.5"/>
    <path d="M20 26l6 4 8-10 4 12M34 40l6-12" stroke="#e0304e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Recall any time</text>
    <text x="56" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Ask Gemini or open Find Hub</text>
    <text x="12" y="66" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#e0304e">SEARCH IN EVERYDAY LANGUAGE</text>
  </g>
  <line x1="390" y1="472" x2="498" y2="420" stroke="#e0304e" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(810,430)">
    <rect x="0" y="0" width="250" height="84" rx="8" fill="#161b22" stroke="#FBBC05" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#FBBC05" stroke-width="1.5"/>
    <path d="M20 31h14l-4 6h4l-4 8M36 26l2 6 8-2" stroke="#FBBC05" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Free, built into Find Hub</text>
    <text x="56" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">September 2026 Android Drop</text>
    <text x="12" y="66" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#FBBC05">NOT REAL-TIME GPS</text>
  </g>
  <line x1="810" y1="472" x2="702" y2="420" stroke="#FBBC05" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <rect x="0" y="300" width="1200" height="1" fill="#642f7f" opacity="0.15" class="dash"/>

  <rect x="480" y="540" width="240" height="2" rx="1" fill="url(#ai)" opacity="0.5"/>
  <text x="600" y="570" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e" letter-spacing="1" opacity="0.6">A SMART NOTEBOOK FOR YOUR THINGS</text>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="440" ry="280" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="56" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.85">TRACKER VS. SAVED LOCATION: BEST OF BOTH</text>

  <g filter="url(#sh)" transform="translate(120,120)">
    <rect x="0" y="0" width="450" height="420" rx="12" fill="#161b22" stroke="#4285F4" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="54" rx="12" fill="#4285F4" opacity="0.12"/>
    <text x="225" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#7aa7ff">BLUETOOTH TRACKER</text>
    <g transform="translate(0,78)">
      <rect x="28" y="8" width="52" height="52" rx="10" fill="#0a0a0f" stroke="#4285F4" stroke-width="1.5"/>
      <circle cx="54" cy="34" r="14" fill="none" stroke="#4285F4" stroke-width="2.5"/>
      <circle cx="54" cy="34" r="4" fill="#4285F4" class="pulse"/>
    </g>
    <text x="110" y="104" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Real-time, signal-based</text>
    <text x="110" y="124" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">Needs a physical tag + battery</text>
    <text x="110" y="142" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">Great for items that move around</text>
    <line x1="28" y1="170" x2="422" y2="170" stroke="#e6edf3" stroke-opacity="0.08"/>
    <text x="28" y="198" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Best for</text>
    <circle cx="40" cy="218" r="4" fill="#4285F4"/><text x="52" y="223" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Keys, backpacks, luggage</text>
    <circle cx="40" cy="246" r="4" fill="#4285F4"/><text x="52" y="251" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Things carried around often</text>
    <circle cx="40" cy="274" r="4" fill="#4285F4"/><text x="52" y="279" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Anything needing live location</text>
    <line x1="28" y1="306" x2="422" y2="306" stroke="#e6edf3" stroke-opacity="0.08"/>
    <text x="28" y="334" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#8b949e">Cost</text>
    <text x="28" y="356" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#f0b9c4">Tag purchase required</text>
  </g>

  <g filter="url(#sh)" transform="translate(630,120)">
    <rect x="0" y="0" width="450" height="420" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="54" rx="12" fill="#642f7f" opacity="0.12"/>
    <text x="225" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#b69ad6">GEMINI SAVE LOCATION</text>
    <g transform="translate(0,78)">
      <rect x="28" y="8" width="52" height="52" rx="10" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.5"/>
      <rect x="36" y="16" width="36" height="36" rx="6" fill="url(#ai)" opacity="0.15"/>
      <text x="54" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" class="pulse">N</text>
    </g>
    <text x="110" y="104" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Manually updated notes</text>
    <text x="110" y="124" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">No hardware, text + photo</text>
    <text x="110" y="142" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e">Great for thin or stationary items</text>
    <line x1="28" y1="170" x2="422" y2="170" stroke="#e6edf3" stroke-opacity="0.08"/>
    <text x="28" y="198" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Best for</text>
    <circle cx="40" cy="218" r="4" fill="#642f7f"/><text x="52" y="223" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Passports &amp; documents</text>
    <circle cx="40" cy="246" r="4" fill="#642f7f"/><text x="52" y="251" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Jewelry in a specific box</text>
    <circle cx="40" cy="274" r="4" fill="#642f7f"/><text x="52" y="279" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c9d1d9">Seasonal items you rarely touch</text>
    <line x1="28" y1="306" x2="422" y2="306" stroke="#e6edf3" stroke-opacity="0.08"/>
    <text x="28" y="334" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#8b949e">Cost</text>
    <text x="28" y="356" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b69ad6">Free, built into Find Hub</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8b949e" letter-spacing="1" opacity="0.7">USE BOTH TOGETHER FOR BEST RESULTS</text>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>

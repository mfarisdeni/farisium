<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <g opacity="0.05" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <text x="600" y="50" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e0304e">Workflow: Photo to AI Video</text>

  <g transform="translate(80, 100)">
    <rect width="220" height="180" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <rect x="15" y="15" width="190" height="100" rx="8" fill="#0d1117" stroke="#21262d"/>
    <path d="M110,40 L110,70 M95,55 L110,40 L125,55" stroke="#e0304e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="80" y="72" width="60" height="28" rx="6" fill="#0d1117" stroke="#e0304e" stroke-width="1.5"/>
    <text x="110" y="91" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e0304e">UPLOAD</text>
    <text x="110" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b949e">1. Upload Photo</text>
  </g>

  <g transform="translate(300, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#e0304e" stroke-width="2" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="80,-6 92,0 80,6" fill="#e0304e"/>
  </g>

  <g transform="translate(400, 100)">
    <rect width="220" height="180" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1.5"/>
    <rect x="15" y="15" width="190" height="100" rx="8" fill="#0d1117" stroke="#21262d"/>
    <circle cx="60" cy="55" r="16" fill="#0d1117" stroke="#21262d"/>
    <text x="60" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e0304e">AI</text>
    <circle cx="110" cy="55" r="16" fill="#0d1117" stroke="#21262d"/>
    <text x="110" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#642f7f">ML</text>
    <circle cx="160" cy="55" r="16" fill="#0d1117" stroke="#21262d"/>
    <text x="160" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e0304e">DL</text>
    <text x="110" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#642f7f">2. Choose Platform</text>
  </g>

  <g transform="translate(620, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#642f7f" stroke-width="2" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="80,-6 92,0 80,6" fill="#642f7f"/>
  </g>

  <g transform="translate(720, 100)">
    <rect width="220" height="180" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <rect x="15" y="15" width="190" height="100" rx="8" fill="#0d1117" stroke="#21262d"/>
    <line x1="35" y1="40" x2="175" y2="40" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="40" r="8" fill="#e0304e"/>
    <line x1="35" y1="65" x2="175" y2="65" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="65" r="8" fill="#642f7f"/>
    <line x1="35" y1="90" x2="175" y2="90" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="90" r="8" fill="#e0304e"/>
    <text x="110" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b949e">3. Configure Settings</text>
  </g>

  <g transform="translate(940, 180)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#e0304e" stroke-width="2" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="80,-6 92,0 80,6" fill="#e0304e"/>
  </g>

  <g transform="translate(1040, 100)">
    <rect width="140" height="180" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <rect x="15" y="15" width="110" height="100" rx="8" fill="#0d1117" stroke="#21262d"/>
    <circle cx="70" cy="65" r="25" fill="#e0304e" opacity="0.9"/>
    <polygon points="62,55 62,75 78,65" fill="white"/>
    <text x="70" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e0304e">4. Generate!</text>
  </g>

  <g transform="translate(80, 320)">
    <rect width="1040" height="260" rx="12" fill="#161b22" stroke="#21262d"/>
    <text x="520" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e0304e">AI Video Platform Comparison</text>
    <rect x="20" y="45" width="1000" height="35" rx="6" fill="#0d1117"/>
    <text x="120" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0304e">Platform</text>
    <text x="320" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#642f7f">Price</text>
    <text x="520" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0304e">Quality</text>
    <text x="720" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#642f7f">Speed</text>
    <text x="920" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0304e">Feature</text>
    <rect x="20" y="85" width="1000" height="40" rx="4" fill="#161b22"/>
    <text x="120" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Runway Gen-3</text>
    <text x="320" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">$12/mo</text>
    <text x="520" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e0304e">*****</text>
    <text x="720" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">5-10s</text>
    <text x="920" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Motion Brush</text>
    <rect x="20" y="130" width="1000" height="40" rx="4" fill="#0d1117" opacity="0.3"/>
    <text x="120" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Pika Labs</text>
    <text x="320" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">Free/$10</text>
    <text x="520" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e0304e">****</text>
    <text x="720" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">3-8s</text>
    <text x="920" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Image-to-Video</text>
    <rect x="20" y="175" width="1000" height="40" rx="4" fill="#161b22"/>
    <text x="120" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Stable Video</text>
    <text x="320" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">Free</text>
    <text x="520" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e0304e">****</text>
    <text x="720" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">4-6s</text>
    <text x="920" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Open Source</text>
    <rect x="20" y="220" width="1000" height="40" rx="4" fill="#0d1117" opacity="0.3"/>
    <text x="120" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Luma Dream Machine</text>
    <text x="320" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">$9.99/mo</text>
    <text x="520" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e0304e">****</text>
    <text x="720" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#484f58">5-10s</text>
    <text x="920" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">Keyframe Input</text>
  </g>

  <rect x="540" y="540" width="120" height="2" rx="1" fill="#e0304e" opacity="0.5"/>
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06"/>
  <text x="60" y="600" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
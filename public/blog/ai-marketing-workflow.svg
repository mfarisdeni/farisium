<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accent-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="ai-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <text x="400" y="65" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Workflow Marketing Konten dengan AI</text>
  <g>
    <rect x="120" y="120" width="130" height="65" rx="10" fill="url(#box-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="120" y="120" width="130" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="185" y="155" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Riset</text>
    <text x="185" y="172" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="10">Analisis tren</text>
  </g>
  <line x1="250" y1="152" x2="280" y2="152" stroke="url(#arrow-grad)" stroke-width="1.5"/>
  <polygon points="280,148 290,152 280,156" fill="#642f7f" fill-opacity="0.6"/>
  <g>
    <rect x="290" y="120" width="130" height="65" rx="10" fill="url(#box-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="290" y="120" width="130" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="355" y="155" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Copywriting</text>
    <text x="355" y="172" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="10">Konten + caption</text>
  </g>
  <line x1="420" y1="152" x2="450" y2="152" stroke="url(#arrow-grad)" stroke-width="1.5"/>
  <polygon points="450,148 460,152 450,156" fill="#642f7f" fill-opacity="0.6"/>
  <g>
    <rect x="460" y="120" width="130" height="65" rx="10" fill="url(#box-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="460" y="120" width="130" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="525" y="155" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Visual</text>
    <text x="525" y="172" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="10">Gambar + video</text>
  </g>
  <line x1="590" y1="152" x2="620" y2="152" stroke="url(#arrow-grad)" stroke-width="1.5"/>
  <polygon points="620,148 630,152 620,156" fill="#642f7f" fill-opacity="0.6"/>
  <g>
    <rect x="630" y="120" width="60" height="65" rx="10" fill="url(#box-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="630" y="120" width="60" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="660" y="155" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, sans-serif" font-size="13" font-weight="600">+</text>
    <text x="660" y="172" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="10">Lainnya</text>
  </g>
  <g>
    <rect x="250" y="270" width="300" height="75" rx="12" fill="url(#ai-box)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4"/>
    <rect x="250" y="270" width="300" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="400" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Didukung Artificial Intelligence</text>
    <text x="400" y="325" text-anchor="middle" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="11">AI mempercepat dan meningkatkan kualitas setiap tahap</text>
  </g>
  <line x1="400" y1="185" x2="400" y2="260" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <polygon points="400,260 395,250 405,250" fill="#ffffff" fill-opacity="0.15"/>
  <g>
    <rect x="200" y="390" width="400" height="55" rx="10" fill="url(#box-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="200" y="390" width="400" height="3" rx="1.5" fill="url(#accent-red)"/>
    <text x="400" y="412" text-anchor="middle" fill="#ffffff" fill-opacity="0.75" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Distribusi Multi-Channel</text>
    <text x="400" y="432" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="11">Publikasi otomatis ke berbagai platform dengan optimasi berkelanjutan</text>
  </g>
  <line x1="660" y1="152" x2="720" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <polygon points="720,400 712,390 722,390" fill="#ffffff" fill-opacity="0.1"/>
  <text x="400" y="475" text-anchor="middle" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="10">Dari riset hingga publikasi — AI menyederhanakan seluruh workflow marketing konten</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }
      @keyframes glow { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
      @keyframes dash { to { stroke-dashoffset:-16 } }
      @keyframes rise { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .dash { animation: dash 1.4s linear infinite; }
      .rise { animation: rise 0.9s ease-out both; }
      .float { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="430" ry="210" fill="url(#glow-g)" filter="url(#blur50)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="2">PRIVATE AI KNOWLEDGE BASE</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">APPROVED SOURCES → RETRIEVE → ANSWER → SHOW SOURCE</text>

  <!-- Flow line -->
  <rect x="60" y="360" width="1080" height="3" rx="1.5" fill="url(#flow)" opacity="0.35"/>
  <rect x="60" y="360" width="1080" height="3" rx="1.5" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 16" class="dash" opacity="0.9"/>

  <!-- Step 1: Documents -->
  <g class="rise" style="animation-delay:0s">
    <rect x="95" y="312" width="160" height="96" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <g class="pulse">
      <rect x="120" y="332" width="70" height="6" rx="3" fill="#e0304e" opacity="0.7"/>
      <rect x="120" y="346" width="100" height="6" rx="3" fill="#e6edf3" opacity="0.35"/>
      <rect x="120" y="360" width="80" height="6" rx="3" fill="#e6edf3" opacity="0.25"/>
    </g>
    <text x="175" y="394" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Documents</text>
    <text x="175" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Approved sources</text>
  </g>

  <!-- Step 2: Retrieval -->
  <g class="rise" style="animation-delay:0.3s">
    <circle cx="445" cy="360" r="30" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="445" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#b57edd">RAG</text>
    <circle cx="445" cy="360" r="38" fill="none" stroke="#642f7f" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:0.6s"/>
    <text x="445" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Retrieval</text>
    <text x="445" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Find right info</text>
  </g>

  <!-- Step 3: Generate -->
  <g class="rise" style="animation-delay:0.6s">
    <rect x="555" y="312" width="170" height="96" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1"/>
    <g class="float">
      <circle cx="600" cy="352" r="14" fill="none" stroke="#e0304e" stroke-width="2"/>
      <circle cx="640" cy="352" r="14" fill="none" stroke="#642f7f" stroke-width="2"/>
      <text x="620" y="357" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">AI</text>
    </g>
    <text x="640" y="394" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Generate</text>
    <text x="640" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">From retrieved context</text>
  </g>

  <!-- Step 4: Source -->
  <g class="rise" style="animation-delay:0.9s">
    <circle cx="925" cy="360" r="30" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="925" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e0304e">Src</text>
    <circle cx="925" cy="360" r="38" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:1.2s"/>
    <text x="925" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Show Source</text>
    <text x="925" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Traceable answer</text>
  </g>

  <!-- Key principle banner -->
  <rect x="235" y="500" width="730" height="64" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.92"/>
  <text x="600" y="527" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Question → Retrieve approved information → Generate answer → Show source</text>
  <text x="600" y="548" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">The AI looks at your approved business information before answering.</text>

  <!-- Brand -->
  <text x="600" y="598" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e" opacity="0.7" letter-spacing="2">farisium.com</text>
</svg>

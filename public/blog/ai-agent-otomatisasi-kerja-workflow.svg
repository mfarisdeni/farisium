<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dashFlow { to { stroke-dashoffset: -24; } }
    @keyframes arrowPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes stepIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes iconBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(220,38,38,0.2)); } 50% { filter: drop-shadow(0 0 10px rgba(220,38,38,0.4)); } }
    .title { animation: fadeIn 0.5s ease-out forwards; }
    .step { animation: stepIn 0.5s ease-out forwards; opacity: 0; }
    .step-1 { animation-delay: 0.2s; }
    .step-2 { animation-delay: 0.4s; }
    .step-3 { animation-delay: 0.6s; }
    .step-4 { animation-delay: 0.8s; }
    .arrow-line { stroke-dasharray: 8 4; animation: dashFlow 0.8s linear infinite; }
    .arrow-head { animation: arrowPulse 1.5s ease-in-out infinite; }
    .icon-anim { animation: iconBounce 2.5s ease-in-out infinite; }
    .glow-ring { animation: glow 3s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="step-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)" rx="12"/>
  <!-- Title -->
  <g class="title">
    <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">AI Agent Workflow</text>
    <text x="600" y="82" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="14">Automation Workflow with AI Agents</text>
  </g>
  <!-- Flow line background -->
  <line x1="180" y1="315" x2="1020" y2="315" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Arrow 1: Input -> AI Agent -->
  <line x1="290" y1="315" x2="420" y2="315" stroke="#dc2626" stroke-width="2" class="arrow-line" marker-end="url(#arrowhead)"/>
  <circle cx="355" cy="315" r="3" fill="#dc2626" class="arrow-head"/>
  <!-- Arrow 2: AI Agent -> Processing -->
  <line x1="570" y1="315" x2="700" y2="315" stroke="#dc2626" stroke-width="2" class="arrow-line" style="animation-delay:0.2s" marker-end="url(#arrowhead)"/>
  <circle cx="635" cy="315" r="3" fill="#dc2626" class="arrow-head" style="animation-delay:0.2s"/>
  <!-- Arrow 3: Processing -> Output -->
  <line x1="850" y1="315" x2="980" y2="315" stroke="#dc2626" stroke-width="2" class="arrow-line" style="animation-delay:0.4s" marker-end="url(#arrowhead)"/>
  <circle cx="915" cy="315" r="3" fill="#dc2626" class="arrow-head" style="animation-delay:0.4s"/>
  <!-- Step 1: Input -->
  <g class="step step-1">
    <rect x="110" y="260" width="180" height="110" rx="16" fill="#111118" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="110" y="260" width="180" height="110" rx="16" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1" filter="url(#step-glow)"/>
    <g transform="translate(175, 278)" class="icon-anim">
      <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="8" y1="10" x2="32" y2="10" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="8" y1="18" x2="26" y2="18" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="8" y1="26" x2="20" y2="26" stroke="#3b82f6" stroke-width="1.5"/>
    </g>
    <text x="200" y="332" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Input</text>
    <text x="200" y="350" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="11">Prompt &amp; Data</text>
  </g>
  <!-- Step 2: AI Agent -->
  <g class="step step-2">
    <rect x="420" y="260" width="150" height="110" rx="16" fill="#111118" stroke="#dc2626" stroke-width="2"/>
    <rect x="420" y="260" width="150" height="110" rx="16" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.15" class="glow-ring"/>
    <g transform="translate(470, 278)" class="icon-anim" style="animation-delay:0.5s">
      <circle cx="30" cy="18" r="14" fill="none" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="24" cy="14" r="2.5" fill="#dc2626"/>
      <circle cx="36" cy="14" r="2.5" fill="#dc2626"/>
      <path d="M22 22 Q30 28 38 22" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="495" y="332" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">AI Agent</text>
    <text x="495" y="350" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="11">Brain &amp; Logic</text>
  </g>
  <!-- Step 3: Processing -->
  <g class="step step-3">
    <rect x="700" y="260" width="150" height="110" rx="16" fill="#111118" stroke="#10b981" stroke-width="1.5"/>
    <rect x="700" y="260" width="150" height="110" rx="16" fill="none" stroke="#10b981" stroke-width="1" opacity="0.1" filter="url(#step-glow)"/>
    <g transform="translate(755, 278)" class="icon-anim" style="animation-delay:1s">
      <circle cx="30" cy="18" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <path d="M24 18 L30 24 L42 12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="775" y="332" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Processing</text>
    <text x="775" y="350" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="11">Tools &amp; Actions</text>
  </g>
  <!-- Step 4: Output -->
  <g class="step step-4">
    <rect x="980" y="260" width="160" height="110" rx="16" fill="#111118" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="980" y="260" width="160" height="110" rx="16" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.1" filter="url(#step-glow)"/>
    <g transform="translate(1035, 278)" class="icon-anim" style="animation-delay:1.5s">
      <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M12 8 L20 20 L28 8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="26" x2="28" y2="26" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
    <text x="1060" y="332" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Output</text>
    <text x="1060" y="350" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="11">Result &amp; Deliver</text>
  </g>
  <!-- Labels below flow -->
  <g opacity="0.4">
    <text x="200" y="420" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">Text, images, data,</text>
    <text x="200" y="436" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">or instructions</text>
    <text x="495" y="420" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">Reasoning, planning,</text>
    <text x="495" y="436" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">decision making</text>
    <text x="775" y="420" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">Tool execution,</text>
    <text x="775" y="436" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">API, database</text>
    <text x="1060" y="420" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">Text, code, files,</text>
    <text x="1060" y="436" text-anchor="middle" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">or actions</text>
  </g>
  <!-- Step numbers -->
  <g>
    <circle cx="200" cy="245" r="10" fill="#3b82f6" opacity="0.2"/>
    <text x="200" y="249" text-anchor="middle" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">1</text>
    <circle cx="495" cy="245" r="10" fill="#dc2626" opacity="0.2"/>
    <text x="495" y="249" text-anchor="middle" fill="#dc2626" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">2</text>
    <circle cx="775" cy="245" r="10" fill="#10b981" opacity="0.2"/>
    <text x="775" y="249" text-anchor="middle" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">3</text>
    <circle cx="1060" cy="245" r="10" fill="#f59e0b" opacity="0.2"/>
    <text x="1060" y="249" text-anchor="middle" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">4</text>
  </g>
  <text x="600" y="618" text-anchor="middle" fill="#4b5563" font-family="Inter, system-ui, sans-serif" font-size="12">farisium.com</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#642f7f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes rotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-20} }
      @keyframes fadeIn { 0%{opacity:0;transform:scale(0.8)} 100%{opacity:1;transform:scale(1)} }
      @keyframes neuronPulse { 0%,100%{r:3;opacity:0.7} 50%{r:5;opacity:1} }
      @keyframes shieldPulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .rotate-slow { animation: rotate 30s linear infinite; transform-origin: 600px 300px; }
      .dash { stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
      .fade-in { animation: fadeIn 1s ease-out forwards; }
      .neuron { animation: neuronPulse 2s ease-in-out infinite; }
      .shield-pulse { animation: shieldPulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="300" cy="250" rx="320" ry="260" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="900" cy="380" rx="300" ry="240" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central shield/badge icon -->
  <g class="float" filter="url(#blur2)">
    <!-- Shield shape -->
    <path d="M600,200 Q680,200 680,280 Q680,360 600,430 Q520,360 520,280 Q520,200 600,200" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <path d="M600,215 Q660,215 660,275 Q660,335 600,395 Q540,335 540,275 Q540,215 600,215" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Chat bubble inside shield -->
    <path d="M550,280 Q580,260 600,270 Q620,260 650,280 Q670,300 650,330 L620,330 Q610,340 610,335 Q610,325 620,320 L640,310 Q650,300 640,290 Q630,280 600,280 Z" fill="url(#accent)" opacity="0.25"/>
    <path d="M560,285 Q585,270 600,275 Q615,270 640,285 Q655,298 635,320 L615,320 Q608,328 608,323 Q608,318 615,312 L630,305 Q638,298 630,290 Q622,283 600,283 Z" fill="#e0304e" opacity="0.15"/>
    
    <!-- Shield pulse ring -->
    <path d="M600,200 Q680,200 680,280 Q680,360 600,430 Q520,360 520,280 Q520,200 600,200" fill="none" stroke="url(#accent)" stroke-width="1" class="shield-pulse" opacity="0.6"/>
    
    <!-- Center lock/protection icon -->
    <circle cx="600" cy="285" r="18" fill="none" stroke="url(#accent)" stroke-width="2" class="pulse"/>
    <path d="M600,275 V295 M590,285 H610" stroke="#e0304e" stroke-width="2" stroke-linecap="round"/>
    <rect x="585" y="268" width="30" height="12" rx="2" fill="none" stroke="#e0304e" stroke-width="1.5"/>
  </g>

  <!-- Neural/data nodes around shield -->
  <g opacity="0.55">
    <circle cx="400" cy="220" r="4" fill="#e0304e" class="neuron" style="animation-delay:0s"/>
    <circle cx="360" cy="310" r="4" fill="#642f7f" class="neuron" style="animation-delay:0.4s"/>
    <circle cx="430" cy="380" r="4" fill="#e0304e" class="neuron" style="animation-delay:0.8s"/>
    <circle cx="800" cy="200" r="4" fill="#642f7f" class="neuron" style="animation-delay:0.2s"/>
    <circle cx="840" cy="310" r="4" fill="#e0304e" class="neuron" style="animation-delay:0.6s"/>
    <circle cx="770" cy="400" r="4" fill="#642f7f" class="neuron" style="animation-delay:1s"/>
    <circle cx="520" cy="170" r="4" fill="#e0304e" class="neuron" style="animation-delay:0.3s"/>
    <circle cx="680" cy="180" r="4" fill="#642f7f" class="neuron" style="animation-delay:0.7s"/>
    <circle cx="540" cy="430" r="4" fill="#e0304e" class="neuron" style="animation-delay:0.5s"/>
    <circle cx="660" cy="440" r="4" fill="#642f7f" class="neuron" style="animation-delay:0.9s"/>
  </g>

  <!-- Data connections -->
  <g stroke="#e0304e" stroke-width="0.7" opacity="0.2" class="dash">
    <line x1="400" y1="220" x2="540" y2="250"/>
    <line x1="360" y1="310" x2="530" y2="290"/>
    <line x1="430" y1="380" x2="550" y2="330"/>
    <line x1="800" y1="200" x2="660" y2="250"/>
    <line x1="840" y1="310" x2="670" y2="290"/>
    <line x1="770" y1="400" x2="650" y2="330"/>
    <line x1="520" y1="170" x2="580" y2="240"/>
    <line x1="680" y1="180" x2="620" y2="240"/>
    <line x1="540" y1="430" x2="580" y2="340"/>
    <line x1="660" y1="440" x2="620" y2="340"/>
  </g>

  <!-- Parent/child connection indicators -->
  <g opacity="0.4">
    <!-- Parent node -->
    <circle cx="600" cy="120" r="14" fill="none" stroke="#642f7f" stroke-width="1.5" stroke-dasharray="6 4" class="dash"/>
    <circle cx="600" cy="120" r="6" fill="#642f7f" class="pulse"/>
    <text x="600" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#8b949e">PARENT</text>
    
    <!-- Teen node -->
    <circle cx="600" cy="480" r="14" fill="none" stroke="#e0304e" stroke-width="1.5" stroke-dasharray="6 4" class="dash" style="animation-delay:1s"/>
    <circle cx="600" cy="480" r="6" fill="#e0304e" class="pulse" style="animation-delay:1s"/>
    <text x="600" y="490" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#8b949e">TEEN</text>
    
    <!-- Link line -->
    <line x1="600" y1="134" x2="600" y2="466" stroke="url(#accent)" stroke-width="1" stroke-dasharray="4 6" class="dash" opacity="0.3"/>
  </g>

  <!-- Orbiting particles -->
  <g class="rotate-slow" opacity="0.45">
    <circle cx="600" cy="80" r="2" fill="#e0304e"/>
    <circle cx="820" cy="300" r="2" fill="#642f7f"/>
    <circle cx="600" cy="520" r="2" fill="#e0304e"/>
    <circle cx="380" cy="300" r="2" fill="#642f7f"/>
    <circle cx="450" cy="150" r="1.5" fill="#e0304e"/>
    <circle cx="750" cy="150" r="1.5" fill="#642f7f"/>
    <circle cx="450" cy="480" r="1.5" fill="#e0304e"/>
    <circle cx="750" cy="480" r="1.5" fill="#642f7f"/>
  </g>

  <!-- Title text -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="1">
    CHATGPT FOR TEENS
  </text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e" letter-spacing="3">
    PARENTAL SAFETY MODE
  </text>

  <!-- Accent line -->
  <rect x="540" y="575" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Subtle stars -->
  <circle cx="100" cy="80" r="1" fill="#e6edf3" opacity="0.3" class="pulse" style="animation-delay:0.2s"/>
  <circle cx="1100" cy="100" r="1" fill="#e6edf3" opacity="0.3" class="pulse" style="animation-delay:1.2s"/>
  <circle cx="180" cy="530" r="1" fill="#e6edf3" opacity="0.2" class="pulse" style="animation-delay:0.7s"/>
  <circle cx="1020" cy="510" r="1" fill="#e6edf3" opacity="0.2" class="pulse" style="animation-delay:1.7s"/>
  <circle cx="880" cy="60" r="1.2" fill="#e0304e" opacity="0.3" class="pulse" style="animation-delay:0.4s"/>
  <circle cx="320" cy="580" r="1.2" fill="#642f7f" opacity="0.3" class="pulse" style="animation-delay:1.4s"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>

  <!-- FARISIUM branding -->
  <text x="60" y="600" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }
      @keyframes glow { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
      @keyframes dash { to { stroke-dashoffset:-24 } }
      @keyframes rise { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .dash { animation: dash 1.4s linear infinite; }
      .rise { animation: rise 0.9s ease-out both; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="320" rx="430" ry="210" fill="url(#glow-g)" filter="url(#blur50)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="3">AI FOR FREELANCE DESIGNERS</text>
  <text x="600" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">FROM BRIEF TO REVISION</text>

  <!-- Flow line -->
  <rect x="110" y="308" width="980" height="3" rx="1.5" fill="url(#flow)" opacity="0.35"/>
  <rect x="110" y="308" width="980" height="3" rx="1.5" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 18" class="dash" opacity="0.9"/>

  <!-- Stage 1: Brief -->
  <g class="rise" style="animation-delay:0s">
    <circle cx="160" cy="310" r="26" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="160" y="317" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e0304e">1</text>
    <circle cx="160" cy="310" r="34" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow"/>
    <text x="160" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Brief</text>
    <text x="160" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Parse &amp; clarify</text>
  </g>

  <!-- Stage 2: Research -->
  <g class="rise" style="animation-delay:0.25s">
    <circle cx="385" cy="310" r="26" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="385" y="317" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b57edd">2</text>
    <circle cx="385" cy="310" r="34" fill="none" stroke="#642f7f" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:0.5s"/>
    <text x="385" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Research</text>
    <text x="385" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Moodboard faster</text>
  </g>

  <!-- Stage 3: Concepts -->
  <g class="rise" style="animation-delay:0.5s">
    <circle cx="610" cy="310" r="26" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="610" y="317" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e0304e">3</text>
    <circle cx="610" cy="310" r="34" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:1s"/>
    <text x="610" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Concepts</text>
    <text x="610" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Rough drafts only</text>
  </g>

  <!-- Stage 4: Communication -->
  <g class="rise" style="animation-delay:0.75s">
    <circle cx="835" cy="310" r="26" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="835" y="317" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b57edd">4</text>
    <circle cx="835" cy="310" r="34" fill="none" stroke="#642f7f" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:1.5s"/>
    <text x="835" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Communication</text>
    <text x="835" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Clear updates</text>
  </g>

  <!-- Stage 5: Revisions -->
  <g class="rise" style="animation-delay:1s">
    <circle cx="1060" cy="310" r="26" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="1060" y="317" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e0304e">5</text>
    <circle cx="1060" cy="310" r="34" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:2s"/>
    <text x="1060" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Revisions</text>
    <text x="1060" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Structured checklist</text>
  </g>

  <!-- AI assist chips -->
  <g class="pulse">
    <rect x="112" y="205" width="96" height="26" rx="13" fill="#e0304e" opacity="0.12"/>
    <text x="160" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#e0304e" letter-spacing="1">AI ASSIST</text>
  </g>
  <g class="pulse" style="animation-delay:0.6s">
    <rect x="337" y="205" width="96" height="26" rx="13" fill="#642f7f" opacity="0.15"/>
    <text x="385" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#b57edd" letter-spacing="1">AI ASSIST</text>
  </g>
  <g class="pulse" style="animation-delay:1.2s">
    <rect x="562" y="205" width="96" height="26" rx="13" fill="#e0304e" opacity="0.12"/>
    <text x="610" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#e0304e" letter-spacing="1">AI ASSIST</text>
  </g>
  <g class="pulse" style="animation-delay:1.8s">
    <rect x="787" y="205" width="96" height="26" rx="13" fill="#642f7f" opacity="0.15"/>
    <text x="835" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#b57edd" letter-spacing="1">AI ASSIST</text>
  </g>
  <g class="pulse" style="animation-delay:2.4s">
    <rect x="1012" y="205" width="96" height="26" rx="13" fill="#e0304e" opacity="0.12"/>
    <text x="1060" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#e0304e" letter-spacing="1">AI ASSIST</text>
  </g>

  <!-- Bottom note -->
  <rect x="380" y="480" width="440" height="64" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.9"/>
  <text x="600" y="507" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">AI speeds up the process.</text>
  <text x="600" y="528" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">You still own the taste and the judgment.</text>

  <!-- Brand -->
  <text x="600" y="598" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e" opacity="0.7" letter-spacing="2">farisium.com</text>
</svg>

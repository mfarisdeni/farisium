<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b0020;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0304e;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#642f7f;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e"/>
      <stop offset="100%" style="stop-color:#642f7f"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e0304e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="600" cy="280" r="280" fill="#e0304e" opacity="0.06" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#e0304e" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#e6edf3" font-weight="700" letter-spacing="-0.3">Agentic Ransomware — JadePuffer Attack Chain</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">LLM Agent Conducts Entire Attack Autonomously</text>

  <!-- Step 1: Reconnaissance -->
  <g transform="translate(100,160)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.9"/>
    <circle cx="70" cy="35" r="18" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="70" cy="35" r="3" fill="#e0304e" opacity="0.5"/>
    <line x1="70" y1="53" x2="70" y2="65" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="65" x2="85" y2="65" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3" font-weight="600">RECON</text>
  </g>

  <!-- Arrow 1 -->
  <g opacity="0.5">
    <line x1="245" y1="210" x2="285" y2="210" stroke="url(#arrowGrad)" stroke-width="2"/>
    <polygon points="285,205 295,210 285,215" fill="#e0304e" opacity="0.6"/>
  </g>

  <!-- Step 2: Exploit CVE -->
  <g transform="translate(300,160)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.9"/>
    <rect x="50" y="20" width="40" height="30" rx="4" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <text x="70" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e0304e" font-weight="600">CVE</text>
    <text x="70" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#e0304e" opacity="0.6">2025-3248</text>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3" font-weight="600">EXPLOIT</text>
  </g>

  <!-- Arrow 2 -->
  <g opacity="0.5">
    <line x1="445" y1="210" x2="485" y2="210" stroke="url(#arrowGrad)" stroke-width="2"/>
    <polygon points="485,205 495,210 485,215" fill="#e0304e" opacity="0.6"/>
  </g>

  <!-- Step 3: Credential Theft -->
  <g transform="translate(500,160)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.9"/>
    <rect x="48" y="18" width="44" height="34" rx="6" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <circle cx="70" cy="35" r="8" fill="none" stroke="#e0304e" stroke-width="1" opacity="0.4"/>
    <line x1="70" y1="43" x2="70" y2="50" stroke="#e0304e" stroke-width="2" opacity="0.5"/>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3" font-weight="600">CREDENTIALS</text>
  </g>

  <!-- Arrow 3 -->
  <g opacity="0.5">
    <line x1="645" y1="210" x2="685" y2="210" stroke="url(#arrowGrad)" stroke-width="2"/>
    <polygon points="685,205 695,210 685,215" fill="#e0304e" opacity="0.6"/>
  </g>

  <!-- Step 4: Lateral Movement -->
  <g transform="translate(700,160)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1.5" opacity="0.9"/>
    <path d="M55,40 L70,25 L85,40" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="25" x2="70" y2="50" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <circle cx="55" cy="45" r="6" fill="none" stroke="#642f7f" stroke-width="1" opacity="0.4"/>
    <circle cx="85" cy="45" r="6" fill="none" stroke="#642f7f" stroke-width="1" opacity="0.4"/>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3" font-weight="600">LATERAL</text>
  </g>

  <!-- Arrow 4 -->
  <g opacity="0.5">
    <line x1="845" y1="210" x2="885" y2="210" stroke="url(#arrowGrad)" stroke-width="2"/>
    <polygon points="885,205 895,210 885,215" fill="#642f7f" opacity="0.6"/>
  </g>

  <!-- Step 5: Escalate -->
  <g transform="translate(900,160)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#161b22" stroke="#642f7f" stroke-width="1.5" opacity="0.9"/>
    <polygon points="70,20 82,45 58,45" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="45" x2="70" y2="55" stroke="#642f7f" stroke-width="1.5" opacity="0.6"/>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3" font-weight="600">ESCALATE</text>
  </g>

  <!-- Vertical arrow down from Escalate to Encrypt -->
  <g opacity="0.5">
    <line x1="970" y1="265" x2="970" y2="305" stroke="url(#arrowGrad)" stroke-width="2"/>
    <polygon points="965,305 970,315 975,305" fill="#e0304e" opacity="0.6"/>
  </g>

  <!-- Step 6: Encrypt (large, prominent) -->
  <g transform="translate(870,320)" filter="url(#nodeShadow)">
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#161b22" stroke="url(#accentGrad)" stroke-width="2" opacity="0.95"/>
    <rect x="72" y="20" width="56" height="45" rx="8" fill="none" stroke="#e0304e" stroke-width="2" opacity="0.7"/>
    <path d="M88,20 L88,12 Q88,0 100,0 Q112,0 112,12 L112,20" fill="none" stroke="#e0304e" stroke-width="2" opacity="0.7"/>
    <circle cx="100" cy="40" r="5" fill="#e0304e" opacity="0.5"/>
    <line x1="100" y1="45" x2="100" y2="52" stroke="#e0304e" stroke-width="2" opacity="0.5"/>
    <text x="100" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e6edf3" font-weight="700">ENCRYPT</text>
    <text x="100" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e0304e" opacity="0.7">1.342 Config Items</text>
  </g>

  <!-- Arrow back to Encrypt from Exploit (vertical) -->
  <g opacity="0.3">
    <line x1="370" y1="265" x2="370" y2="370" stroke="#e0304e" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="370" y1="370" x2="865" y2="370" stroke="#e0304e" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- LLM Agent badge -->
  <g transform="translate(220,320)">
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e0304e" font-weight="600" letter-spacing="1">LLM AGENT</text>
    <text x="100" y="50" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8b949e">Otonom &amp; Adaptif</text>
    <!-- Brain icon -->
    <path d="M85,65 Q80,58 85,52 Q90,46 95,52 Q100,46 105,52 Q110,46 115,52 Q120,58 115,65 Q110,72 105,65 Q100,72 95,65 Q90,72 85,65" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.5"/>
    <text x="100" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#8b949e">Retry on failure</text>
    <text x="100" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#8b949e">Adapt parsing logic</text>
  </g>

  <!-- Connection from LLM to all steps -->
  <g opacity="0.08" stroke="#e0304e" stroke-width="1">
    <line x1="320" y1="340" x2="170" y2="255"/>
    <line x1="320" y1="340" x2="370" y2="255"/>
    <line x1="320" y1="340" x2="570" y2="255"/>
    <line x1="320" y1="340" x2="770" y2="255"/>
    <line x1="320" y1="340" x2="970" y2="255"/>
    <line x1="320" y1="370" x2="865" y2="370"/>
  </g>

  <!-- Time indicator -->
  <g transform="translate(600,500)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e0304e" font-weight="500">31 seconds: from failed login to working fix</text>
  </g>

  <!-- Bottom labels -->
  <text x="600" y="570" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e">Source: Sysdig Threat Research — JadePuffer Campaign, July 2026</text>

  <!-- Farisium badge -->
  <g transform="translate(600,610)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58" font-weight="500" letter-spacing="2">FARISIUM</text>
  </g>
</svg>

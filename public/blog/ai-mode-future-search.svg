<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>
  
  <!-- Horizon glow -->
  <ellipse cx="600" cy="400" rx="600" ry="200" fill="url(#horizon)" filter="url(#glow3)"/>
  
  <!-- Perspective grid lines -->
  <g opacity="0.06" stroke="#4285f4" stroke-width="1">
    <!-- Horizontal -->
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="380" x2="1100" y2="380"/>
    <line x1="200" y1="410" x2="1000" y2="410"/>
    <line x1="300" y1="440" x2="900" y2="440"/>
    <line x1="380" y1="470" x2="820" y2="470"/>
    <line x1="440" y1="500" x2="760" y2="500"/>
    <line x1="490" y1="530" x2="710" y2="530"/>
    <line x1="530" y1="560" x2="670" y2="560"/>
    <!-- Vertical converging -->
    <line x1="600" y1="350" x2="600" y2="600"/>
    <line x1="500" y1="350" x2="560" y2="600"/>
    <line x1="700" y1="350" x2="640" y2="600"/>
    <line x1="400" y1="350" x2="520" y2="600"/>
    <line x1="800" y1="350" x2="680" y2="600"/>
    <line x1="300" y1="350" x2="480" y2="600"/>
    <line x1="900" y1="350" x2="720" y2="600"/>
  </g>
  
  <!-- Central AI brain visualization -->
  <g transform="translate(600,240)">
    <!-- Outer ring -->
    <circle r="100" fill="none" stroke="#4285f4" stroke-width="0.5" opacity="0.3"/>
    <circle r="80" fill="none" stroke="#9b72cb" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Neural connections -->
    <g opacity="0.15" stroke="#4285f4" stroke-width="1">
      <line x1="0" y1="-60" x2="40" y2="-30"/>
      <line x1="40" y1="-30" x2="60" y2="0"/>
      <line x1="60" y1="0" x2="40" y2="30"/>
      <line x1="40" y1="30" x2="0" y2="60"/>
      <line x1="0" y1="60" x2="-40" y2="30"/>
      <line x1="-40" y1="30" x2="-60" y2="0"/>
      <line x1="-60" y1="0" x2="-40" y2="-30"/>
      <line x1="-40" y1="-30" x2="0" y2="-60"/>
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <line x1="-60" y1="0" x2="60" y2="0"/>
    </g>
    
    <!-- Nodes -->
    <circle cx="0" cy="-60" r="5" fill="#4285f4"/>
    <circle cx="40" cy="-30" r="4" fill="#9b72cb"/>
    <circle cx="60" cy="0" r="5" fill="#34a853"/>
    <circle cx="40" cy="30" r="4" fill="#ea4335"/>
    <circle cx="0" cy="60" r="5" fill="#fbbc04"/>
    <circle cx="-40" cy="30" r="4" fill="#4285f4"/>
    <circle cx="-60" cy="0" r="5" fill="#9b72cb"/>
    <circle cx="-40" cy="-30" r="4" fill="#34a853"/>
    <circle cx="0" cy="0" r="8" fill="#4285f4" opacity="0.8"/>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="2" fill="#4285f4"/>
    <circle cx="350" cy="150" r="3" fill="#9b72cb"/>
    <circle cx="850" cy="180" r="2" fill="#34a853"/>
    <circle cx="1000" cy="250" r="3" fill="#ea4335"/>
    <circle cx="150" cy="300" r="2" fill="#fbbc04"/>
    <circle cx="1050" cy="350" r="2" fill="#4285f4"/>
    <circle cx="280" cy="280" r="2" fill="#34a853"/>
    <circle cx="920" cy="150" r="2" fill="#9b72cb"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#e6edf3" font-weight="700">The Future of Search with AI</text>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b949e">How Gemini 3 is Transforming Google Search</text>
  
  <!-- Timeline markers -->
  <g transform="translate(600,400)">
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#30363d" stroke-width="1"/>
    
    <!-- Point 1: Past -->
    <circle cx="-150" cy="0" r="6" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <text x="-150" y="-15" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58">2023</text>
    <text x="-150" y="25" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#484f58">Bard</text>
    
    <!-- Point 2: Present -->
    <circle cx="0" cy="0" r="8" fill="#4285f4" stroke="#4285f4" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4285f4" font-weight="600">2025</text>
    <text x="0" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e6edf3">Gemini 3</text>
    
    <!-- Point 3: Future -->
    <circle cx="150" cy="0" r="6" fill="#0d1117" stroke="#484f58" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="150" y="-15" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58">2026+</text>
    <text x="150" y="25" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#484f58">Next</text>
  </g>
  
  <!-- Bottom stats -->
  <g transform="translate(600,520)">
    <text x="-250" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#4285f4" font-weight="700">1M+</text>
    <text x="-250" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Token Context</text>
    
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#9b72cb" font-weight="700">24/7</text>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Search Live</text>
    
    <text x="250" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#34a853" font-weight="700">All</text>
    <text x="250" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Modalities</text>
  </g>
  
  <!-- Farisium badge -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58" font-weight="500" letter-spacing="2">FARISIUM</text>
</svg>

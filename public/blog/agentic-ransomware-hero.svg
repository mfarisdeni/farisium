<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#8b0020;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e"/>
      <stop offset="100%" style="stop-color:#642f7f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0304e"/>
      <stop offset="100%" style="stop-color:#8b0020"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="600" cy="280" r="320" fill="url(#glow)" filter="url(#blur1)"/>
  <circle cx="250" cy="150" r="180" fill="#e0304e" opacity="0.04" filter="url(#blur1)"/>
  <circle cx="950" cy="450" r="200" fill="#642f7f" opacity="0.03" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#e0304e" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- AI Agent Robot Head -->
  <g transform="translate(600,220)" filter="url(#glowFilter)">
    <!-- Robot head -->
    <rect x="-55" y="-70" width="110" height="100" rx="20" fill="#161b22" stroke="url(#robotGrad)" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-35" r="10" fill="url(#robotGrad)" opacity="0.9"/>
    <circle cx="20" cy="-35" r="10" fill="url(#robotGrad)" opacity="0.9"/>
    <!-- Eye glow -->
    <circle cx="-20" cy="-35" r="5" fill="#e0304e" opacity="0.6"/>
    <circle cx="20" cy="-35" r="5" fill="#e0304e" opacity="0.6"/>
    <!-- Mouth -->
    <rect x="-25" y="-5" width="50" height="4" rx="2" fill="#e0304e" opacity="0.5"/>
    <!-- Antenna -->
    <line x1="0" y1="-70" x2="0" y2="-95" stroke="url(#robotGrad)" stroke-width="2"/>
    <circle cx="0" cy="-95" r="5" fill="#e0304e" opacity="0.8"/>
    <!-- Brain circuit lines -->
    <path d="M-35,-50 L-50,-50 L-50,-30 L-35,-30" fill="none" stroke="#e0304e" stroke-width="1" opacity="0.3"/>
    <path d="M35,-50 L50,-50 L50,-30 L35,-30" fill="none" stroke="#642f7f" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Connection lines from robot to network nodes -->
  <g opacity="0.12" stroke="#e0304e" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="545" y1="250" x2="300" y2="180"/>
    <line x1="655" y1="250" x2="900" y2="180"/>
    <line x1="545" y1="280" x2="280" y2="350"/>
    <line x1="655" y1="280" x2="920" y2="350"/>
    <line x1="600" y1="330" x2="600" y2="400"/>
  </g>

  <!-- Network nodes (attack targets) -->
  <!-- Server node -->
  <g transform="translate(300,165)">
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.8"/>
    <circle cx="-10" cy="0" r="3" fill="#e0304e" opacity="0.6"/>
    <circle cx="10" cy="0" r="3" fill="#e0304e" opacity="0.6"/>
    <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#e0304e" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="8" x2="15" y2="8" stroke="#e0304e" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Database node -->
  <g transform="translate(900,165)">
    <ellipse cx="0" cy="-12" rx="25" ry="10" fill="none" stroke="#642f7f" stroke-width="1.5" opacity="0.8"/>
    <path d="M-25,-12 L-25,12" stroke="#642f7f" stroke-width="1.5" opacity="0.8"/>
    <path d="M25,-12 L25,12" stroke="#642f7f" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="12" rx="25" ry="10" fill="#161b22" stroke="#642f7f" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#642f7f" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Workstation node -->
  <g transform="translate(280,355)">
    <rect x="-25" y="-18" width="50" height="36" rx="4" fill="#161b22" stroke="#e0304e" stroke-width="1.5" opacity="0.8"/>
    <rect x="-20" y="-14" width="40" height="22" rx="2" fill="none" stroke="#e0304e" stroke-width="1" opacity="0.4"/>
    <rect x="-8" y="12" width="16" height="3" rx="1" fill="#e0304e" opacity="0.3"/>
  </g>

  <!-- Cloud node -->
  <g transform="translate(920,355)">
    <path d="M-20,5 Q-30,-10 -15,-15 Q-5,-25 10,-15 Q20,-20 28,-10 Q35,0 25,8 Z" fill="#161b22" stroke="#642f7f" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Lock icon (encryption) at center bottom -->
  <g transform="translate(600,415)">
    <rect x="-22" y="-5" width="44" height="35" rx="6" fill="#161b22" stroke="url(#shieldGrad)" stroke-width="2"/>
    <path d="M-12,-5 L-12,-15 Q-12,-28 0,-28 Q12,-28 12,-15 L12,-5" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="12" r="4" fill="#e0304e" opacity="0.7"/>
    <line x1="0" y1="16" x2="0" y2="22" stroke="#e0304e" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Pulsing warning indicators -->
  <circle cx="200" cy="280" r="6" fill="none" stroke="#e0304e" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="280" r="6" fill="none" stroke="#e0304e" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="6;12;6" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Data flow particles -->
  <circle cx="420" cy="215" r="2" fill="#e0304e" opacity="0.6">
    <animate attributeName="cx" values="420;545" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="215;250" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="215" r="2" fill="#642f7f" opacity="0.6">
    <animate attributeName="cx" values="780;655" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="215;250" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#e6edf3" font-weight="700" letter-spacing="-0.5">What Is Agentic Ransomware?</text>
  <text x="600" y="545" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b949e" font-weight="400">The First Autonomous AI Attack That Ever Happened</text>

  <!-- Farisium badge -->
  <g transform="translate(600,590)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58" font-weight="500" letter-spacing="2">FARISIUM</text>
  </g>
</svg>

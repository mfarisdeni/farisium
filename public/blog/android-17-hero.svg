<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="android" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes dash{to{stroke-dashoffset:-24}}
      @keyframes glowp{0%,100%{opacity:.35}50%{opacity:.9}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.5s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.2s linear infinite}
      .glowp{animation:glowp 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="360" cy="300" rx="320" ry="260" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="50" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">ANDROID 17: SECURITY-FIRST &amp; THE NEW AI ERA</text>

  <g transform="translate(560,330)" filter="url(#sh)">
    <rect x="-65" y="-100" width="130" height="200" rx="22" fill="#161b22" stroke="#3DDC84" stroke-width="2"/>
    <rect x="-53" y="-86" width="106" height="172" rx="8" fill="#0a0a0f"/>
    <rect x="-46" y="-78" width="92" height="14" rx="3" fill="#3DDC84" opacity="0.12"/>
    <text x="0" y="-68" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="7" font-weight="600" fill="#3DDC84" letter-spacing="1">ANDROID 17</text>
    <rect x="-46" y="-54" width="40" height="40" rx="8" fill="#3DDC84" opacity="0.1"/>
    <path d="M-30 -36 l12 12 l22 -22" stroke="#3DDC84" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="glowp"/>
    <rect x="6" y="-54" width="40" height="18" rx="6" fill="#642f7f"/>
    <text x="26" y="-42" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#fff">AI</text>
    <rect x="-46" y="-8" width="92" height="10" rx="5" fill="#21262d"/>
    <rect x="-46" y="8" width="92" height="10" rx="5" fill="#21262d"/>
    <rect x="-46" y="24" width="60" height="10" rx="5" fill="#21262d"/>
    <rect x="-46" y="44" width="92" height="10" rx="5" fill="#2ea043" opacity="0.5"/>
    <rect x="-46" y="58" width="70" height="10" rx="5" fill="#2ea043" opacity="0.35"/>
    <rect x="-45" y="74" width="90" height="6" rx="3" fill="#3DDC84" opacity="0.3"/>
    <circle cx="0" cy="-46" r="4" fill="#3DDC84" class="blink"/>
  </g>

  <g filter="url(#sh)" transform="translate(140,140)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#161b22" stroke="#3DDC84" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#3DDC84" stroke-width="1.5"/>
    <path d="M18 31l6 6 12-14" stroke="#3DDC84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Theft protections on by default</text>
    <text x="56" y="46" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Theft Detection Lock + Remote Lock</text>
    <text x="12" y="62" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3DDC84">PROTECTED BY DEFAULT</text>
  </g>
  <line x1="370" y1="178" x2="495" y2="230" stroke="#3DDC84" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(820,140)">
    <rect x="0" y="0" width="240" height="76" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.5"/>
    <path d="M20 29h10l-2 4h4l-4 8h7l-7 12" stroke="#e0304e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">PIN attempts strictly limited</text>
    <text x="56" y="46" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Fewer guesses, longer lockouts</text>
    <text x="12" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#e0304e">&gt; THEFT HARDER TO PULL OFF</text>
  </g>
  <line x1="820" y1="178" x2="705" y2="230" stroke="#e0304e" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(140,420)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="9" fill="none" stroke="#642f7f" stroke-width="2"/>
    <circle cx="29" cy="29" r="3" fill="#642f7f"/>
    <text x="56" y="28" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Live Threat Detection</text>
    <text x="56" y="46" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">On-device AI watches app behavior</text>
    <text x="12" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#642f7f">ON-DEVICE AI SECURITY</text>
  </g>
  <line x1="370" y1="458" x2="495" y2="400" stroke="#642f7f" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(820,420)">
    <rect x="0" y="0" width="240" height="76" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1" opacity="0.92"/>
    <rect x="12" y="12" width="34" height="34" rx="7" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.5"/>
    <path d="M20 26l14 2-10 6 8 2-12 8" stroke="#f0883e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Gemini agentic browsing</text>
    <text x="56" y="46" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Auto browse books, updates, plans</text>
    <text x="12" y="62" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#f0883e">AI AGENTS IN CHROME</text>
  </g>
  <line x1="820" y1="458" x2="705" y2="400" stroke="#f0883e" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <rect x="0" y="290" width="1200" height="1" fill="#3DDC84" opacity="0.12" class="dash"/>

  <rect x="480" y="528" width="240" height="2" rx="1" fill="url(#android)" opacity="0.5"/>
  <text x="600" y="560" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8b949e" letter-spacing="1" opacity="0.6">SAFER BY DEFAULT, SMARTER BY DESIGN</text>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
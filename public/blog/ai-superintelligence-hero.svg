<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brain-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#642f7f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes rotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-20} }
      @keyframes fadeIn { 0%{opacity:0;transform:scale(0.8)} 100%{opacity:1;transform:scale(1)} }
      @keyframes neuronPulse { 0%,100%{r:3;opacity:0.7} 50%{r:5;opacity:1} }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .rotate-slow { animation: rotate 30s linear infinite; transform-origin: 600px 300px; }
      .dash { stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
      .fade-in { animation: fadeIn 1s ease-out forwards; }
      .neuron { animation: neuronPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glows -->
  <ellipse cx="350" cy="280" rx="300" ry="250" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="850" cy="350" rx="280" ry="220" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Rotating outer ring -->
  <g class="rotate-slow" opacity="0.3">
    <circle cx="600" cy="300" r="200" fill="none" stroke="url(#accent)" stroke-width="1" stroke-dasharray="12 6"/>
    <circle cx="600" cy="300" r="230" fill="none" stroke="#e0304e" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
  </g>

  <!-- Brain glow center -->
  <circle cx="600" cy="300" r="120" fill="url(#brain-glow)" filter="url(#blur1)"/>

  <!-- Central brain/core icon -->
  <g class="float" filter="url(#blur2)">
    <!-- Outer hexagon -->
    <polygon points="600,220 660,260 660,340 600,380 540,340 540,260" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    <!-- Inner hexagon -->
    <polygon points="600,240 645,270 645,330 600,360 555,330 555,270" fill="none" stroke="#e0304e" stroke-width="1.5" opacity="0.6"/>
    <!-- Brain symbol lines -->
    <path d="M580,290 Q590,270 600,280 Q610,270 620,290" fill="none" stroke="#e6edf3" stroke-width="2" class="pulse"/>
    <path d="M585,300 Q600,285 615,300" fill="none" stroke="#e6edf3" stroke-width="1.5" opacity="0.7"/>
    <path d="M590,310 Q600,300 610,310" fill="none" stroke="#e6edf3" stroke-width="1.5" opacity="0.5"/>
    <!-- Center dot -->
    <circle cx="600" cy="295" r="4" fill="#e0304e" class="pulse"/>
  </g>

  <!-- Neural network nodes -->
  <g opacity="0.6">
    <circle cx="420" cy="220" r="3" fill="#e0304e" class="neuron" style="animation-delay:0s"/>
    <circle cx="380" cy="310" r="3" fill="#642f7f" class="neuron" style="animation-delay:0.5s"/>
    <circle cx="450" cy="380" r="3" fill="#e0304e" class="neuron" style="animation-delay:1s"/>
    <circle cx="780" cy="200" r="3" fill="#642f7f" class="neuron" style="animation-delay:0.3s"/>
    <circle cx="820" cy="320" r="3" fill="#e0304e" class="neuron" style="animation-delay:0.8s"/>
    <circle cx="750" cy="400" r="3" fill="#642f7f" class="neuron" style="animation-delay:1.3s"/>
    <circle cx="500" cy="160" r="3" fill="#e0304e" class="neuron" style="animation-delay:0.6s"/>
    <circle cx="700" cy="170" r="3" fill="#642f7f" class="neuron" style="animation-delay:1.1s"/>
    <circle cx="520" cy="430" r="3" fill="#e0304e" class="neuron" style="animation-delay:0.4s"/>
    <circle cx="680" cy="440" r="3" fill="#642f7f" class="neuron" style="animation-delay:0.9s"/>
  </g>

  <!-- Neural connections -->
  <g stroke="#e0304e" stroke-width="0.8" opacity="0.25" class="dash">
    <line x1="420" y1="220" x2="540" y2="260"/>
    <line x1="380" y1="310" x2="540" y2="300"/>
    <line x1="450" y1="380" x2="540" y2="340"/>
    <line x1="780" y1="200" x2="660" y2="260"/>
    <line x1="820" y1="320" x2="660" y2="300"/>
    <line x1="750" y1="400" x2="660" y2="340"/>
    <line x1="500" y1="160" x2="580" y2="260"/>
    <line x1="700" y1="170" x2="620" y2="260"/>
    <line x1="520" y1="430" x2="580" y2="340"/>
    <line x1="680" y1="440" x2="620" y2="340"/>
    <!-- Cross connections -->
    <line x1="420" y1="220" x2="780" y2="200"/>
    <line x1="380" y1="310" x2="820" y2="320"/>
    <line x1="450" y1="380" x2="750" y2="400"/>
  </g>

  <!-- Orbiting particles -->
  <g class="rotate-slow" opacity="0.5">
    <circle cx="600" cy="100" r="2" fill="#e0304e"/>
    <circle cx="800" cy="300" r="2" fill="#642f7f"/>
    <circle cx="600" cy="500" r="2" fill="#e0304e"/>
    <circle cx="400" cy="300" r="2" fill="#642f7f"/>
  </g>

  <!-- Title text -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#e6edf3" letter-spacing="1">
    AI SUPERINTELLIGENCE
  </text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e" letter-spacing="3">
    BEYOND HUMAN INTELLIGENCE
  </text>

  <!-- Accent line -->
  <rect x="540" y="575" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="1" fill="#e6edf3" opacity="0.3" class="pulse" style="animation-delay:0.2s"/>
  <circle cx="1080" cy="120" r="1" fill="#e6edf3" opacity="0.3" class="pulse" style="animation-delay:1.2s"/>
  <circle cx="200" cy="520" r="1" fill="#e6edf3" opacity="0.2" class="pulse" style="animation-delay:0.7s"/>
  <circle cx="1000" cy="500" r="1" fill="#e6edf3" opacity="0.2" class="pulse" style="animation-delay:1.7s"/>
  <circle cx="900" cy="60" r="1.2" fill="#e0304e" opacity="0.3" class="pulse" style="animation-delay:0.4s"/>
  <circle cx="300" cy="580" r="1.2" fill="#642f7f" opacity="0.3" class="pulse" style="animation-delay:1.4s"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>

  <!-- FARISIUM branding -->
  <text x="60" y="600" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#e0304e"/>
    </linearGradient>
    <linearGradient id="ok" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5;r:4}50%{opacity:1;r:6}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-16}}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes scan{0%{y:140}50%{y:160}100%{y:140}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.2s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.5s linear infinite}
      .spin{animation:spin 4s linear infinite;transform-origin:600px 180px}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="350" ry="200" fill="url(#glow-r)" filter="url(#blur)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">AI AGENT STUCK LOOP DIAGNOSTIC</text>

  <!-- Central agent icon -->
  <g class="spin" opacity="0.2">
    <circle cx="600" cy="180" r="70" fill="none" stroke="url(#accent)" stroke-width="1" stroke-dasharray="6 3"/>
  </g>
  <circle cx="600" cy="180" r="45" fill="#161b22" stroke="#e0304e" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="175" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#e0304e">AGENT</text>
  <text x="600" y="192" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">STATUS</text>
  <circle cx="600" cy="180" r="45" fill="none" stroke="#e0304e" stroke-width="0.5" opacity="0.3" class="blink"/>

  <!-- Flow: Task Input -->
  <rect x="80" y="150" width="140" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="150" y="175" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#3fb950">TASK INPUT</text>
  <text x="150" y="192" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">User Request</text>
  <line x1="220" y1="180" x2="555" y2="180" stroke="#3fb950" stroke-width="1.5" class="dash"/>

  <!-- Flow: Output -->
  <rect x="980" y="150" width="140" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1050" y="175" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#3fb950">OUTPUT</text>
  <text x="1050" y="192" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Result</text>
  <line x1="645" y1="180" x2="980" y2="180" stroke="#3fb950" stroke-width="1.5" class="dash"/>

  <!-- Stuck loop visualization - circular arrows -->
  <g transform="translate(600,340)">
    <circle r="65" fill="none" stroke="#e0304e" stroke-width="2" stroke-dasharray="12 4" opacity="0.6" class="blink"/>
    <path d="M0,-55 A55,55 0 0,1 48,27" fill="none" stroke="#e0304e" stroke-width="3" marker-end="url(#arrowR)"/>
    <path d="M48,27 A55,55 0 0,1 -48,27" fill="none" stroke="#f0883e" stroke-width="3" marker-end="url(#arrowO)"/>
    <path d="M-48,27 A55,55 0 0,1 0,-55" fill="none" stroke="#642f7f" stroke-width="3" marker-end="url(#arrowP)"/>
    <text y="-5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e0304e">STUCK</text>
    <text y="12" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#f0883e">LOOP</text>
  </g>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e0304e"/></marker>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#f0883e"/></marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#642f7f"/></marker>
  </defs>

  <!-- Connection from agent down to loop -->
  <line x1="600" y1="225" x2="600" y2="272" stroke="#e0304e" stroke-width="1.5" class="dash"/>

  <!-- Diagnosis cards -->
  <g filter="url(#shadow)">
    <!-- Card 1 -->
    <rect x="80" y="440" width="250" height="90" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8"/>
    <circle cx="110" cy="465" r="12" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.5"/>
    <text x="110" y="469" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#e0304e">1</text>
    <text x="135" y="469" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Infinite Loop</text>
    <text x="100" y="495" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Agent mengulang aksi yang sama</text>
    <text x="100" y="510" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">tanpa batas tanpa hasil</text>
  </g>
  <g filter="url(#shadow)">
    <!-- Card 2 -->
    <rect x="370" y="440" width="250" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="0.8"/>
    <circle cx="400" cy="465" r="12" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.5"/>
    <text x="400" y="469" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0883e">2</text>
    <text x="425" y="469" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Deadlock</text>
    <text x="390" y="495" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Dua agent saling menunggu</text>
    <text x="390" y="510" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">input satu sama lain</text>
  </g>
  <g filter="url(#shadow)">
    <!-- Card 3 -->
    <rect x="660" y="440" width="250" height="90" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8"/>
    <circle cx="690" cy="465" r="12" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.5"/>
    <text x="690" y="469" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#642f7f">3</text>
    <text x="715" y="469" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">API Timeout</text>
    <text x="680" y="495" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Respons API terlalu lambat</text>
    <text x="680" y="510" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">atau tidak pernah kembali</text>
  </g>
  <g filter="url(#shadow)">
    <!-- Card 4 -->
    <rect x="950" y="440" width="200" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.8"/>
    <circle cx="980" cy="465" r="12" fill="#0a0a0f" stroke="#3fb950" stroke-width="1.5"/>
    <text x="980" y="469" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#3fb950">4</text>
    <text x="1005" y="469" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Self-Correction</text>
    <text x="970" y="495" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Agent memperbaiki</text>
    <text x="970" y="510" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">dirinya sendiri</text>
  </g>

  <!-- Accent line -->
  <rect x="540" y="560" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="600" y="590" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" letter-spacing="1" opacity="0.5">DIAGNOSTIK &amp; SOLUSI UNTUK AI AGENT YANG BERHENTI BEKERJA</text>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="danger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
      @keyframes scan{0%{opacity:.3}50%{opacity:.8}100%{opacity:.3}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .blink{animation:blink 1.5s ease-in-out infinite}
      .shake{animation:shake 0.5s ease-in-out infinite}
      .scan{animation:scan 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="300" ry="250" fill="url(#glow)" filter="url(#blur)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="50" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">SIGNS YOUR WHATSAPP IS HACKED &amp; HOW TO FIX IT</text>

  <g transform="translate(600,260)" class="shake">
    <rect x="-55" y="-90" width="110" height="180" rx="16" fill="#161b22" stroke="#25D366" stroke-width="2"/>
    <rect x="-45" y="-75" width="90" height="145" rx="4" fill="#0a0a0f"/>
    <rect x="-38" y="-68" width="76" height="16" rx="3" fill="#25D366" opacity="0.15"/>
    <text x="0" y="-56" text-anchor="middle" font-family="monospace" font-size="8" fill="#25D366" opacity="0.7">WhatsApp</text>
    <rect x="-38" y="-42" width="50" height="12" rx="4" fill="#005C4B" opacity="0.6"/>
    <rect x="-38" y="-24" width="60" height="12" rx="4" fill="#005C4B" opacity="0.5"/>
    <rect x="-18" y="-6" width="56" height="12" rx="4" fill="#1F2C34" opacity="0.6"/>
    <circle cx="35" cy="-80" r="10" fill="#e0304e" class="blink"/>
    <text x="35" y="-77" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">!</text>
    <rect x="-45" y="55" width="90" height="8" rx="4" fill="#25D366" opacity="0.3"/>
  </g>

  <g filter="url(#sh)" transform="translate(200,140)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="1" opacity="0.9"/>
    <circle cx="28" cy="35" r="14" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.5"/>
    <text x="28" y="40" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#e0304e">!</text>
    <text x="52" y="28" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">WhatsApp Opens by Itself</text>
    <text x="52" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Suspicious activity detected</text>
  </g>
  <line x1="320" y1="175" x2="545" y2="220" stroke="#e0304e" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(800,140)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1" opacity="0.9"/>
    <circle cx="28" cy="35" r="14" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.5"/>
    <text x="28" y="40" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#f0883e">?</text>
    <text x="52" y="28" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Messages Sent by Themselves</text>
    <text x="52" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Without your knowledge</text>
  </g>
  <line x1="800" y1="175" x2="655" y2="220" stroke="#f0883e" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(120,380)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="1" opacity="0.9"/>
    <circle cx="28" cy="35" r="14" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.5"/>
    <text x="28" y="39" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#642f7f">2</text>
    <text x="52" y="28" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Logged In on Another Device</text>
    <text x="52" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Suspicious linked device</text>
  </g>
  <line x1="340" y1="415" x2="545" y2="340" stroke="#642f7f" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <g filter="url(#sh)" transform="translate(860,380)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1" opacity="0.9"/>
    <circle cx="28" cy="35" r="14" fill="#0a0a0f" stroke="#3fb950" stroke-width="1.5"/>
    <text x="28" y="40" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#3fb950">OTP</text>
    <text x="52" y="28" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e6edf3">OTP Requested by Others</text>
    <text x="52" y="45" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Common phishing tactic</text>
  </g>
  <line x1="860" y1="415" x2="655" y2="340" stroke="#3fb950" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 3"/>

  <rect x="0" y="290" width="1200" height="1" fill="#25D366" opacity="0.15" class="scan"/>

  <rect x="500" y="530" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
  <text x="600" y="565" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" letter-spacing="1" opacity="0.5">SECURE YOUR WHATSAPP ACCOUNT NOW</text>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
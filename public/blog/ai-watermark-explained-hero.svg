<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642f7f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0304e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#642f7f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Ambient glows -->
  <ellipse cx="350" cy="315" rx="300" ry="250" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="850" cy="315" rx="280" ry="220" fill="url(#glow2)" filter="url(#blur1)"/>
  <ellipse cx="600" cy="315" rx="200" ry="200" fill="url(#wm-glow)" filter="url(#blur1)"/>

  <!-- Left: Digital document frame -->
  <g transform="translate(180, 140)">
    <!-- Document shadow -->
    <rect x="8" y="8" width="280" height="350" rx="12" fill="#000000" opacity="0.3" filter="url(#blur2)"/>
    <!-- Document body -->
    <rect x="0" y="0" width="280" height="350" rx="12" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Document header bar -->
    <rect x="0" y="0" width="280" height="36" rx="12" fill="#1a1a28"/>
    <rect x="0" y="24" width="280" height="12" fill="#1a1a28"/>
    <!-- Dots -->
    <circle cx="20" cy="18" r="4" fill="#e0304e" opacity="0.7"/>
    <circle cx="36" cy="18" r="4" fill="#f5a623" opacity="0.7"/>
    <circle cx="52" cy="18" r="4" fill="#4ade80" opacity="0.7"/>
    <!-- Text lines (simulated content) -->
    <rect x="16" y="52" width="180" height="8" rx="4" fill="#2a2a3a" opacity="0.6"/>
    <rect x="16" y="70" width="240" height="8" rx="4" fill="#2a2a3a" opacity="0.4"/>
    <rect x="16" y="88" width="200" height="8" rx="4" fill="#2a2a3a" opacity="0.5"/>
    <rect x="16" y="110" width="250" height="6" rx="3" fill="#2a2a3a" opacity="0.3"/>
    <rect x="16" y="124" width="160" height="6" rx="3" fill="#2a2a3a" opacity="0.3"/>
    <!-- Image placeholder in document -->
    <rect x="16" y="148" width="248" height="120" rx="8" fill="#181828" stroke="#2a2a3a" stroke-width="1"/>
    <g transform="translate(100, 188)">
      <!-- Mountain/landscape icon -->
      <polygon points="0,40 30,0 60,40" fill="#2a2a3a" opacity="0.5"/>
      <polygon points="25,40 55,10 85,40" fill="#2a2a3a" opacity="0.3"/>
      <circle cx="70" cy="15" r="8" fill="#f5a623" opacity="0.3"/>
    </g>
    <!-- More text lines -->
    <rect x="16" y="280" width="220" height="6" rx="3" fill="#2a2a3a" opacity="0.3"/>
    <rect x="16" y="296" width="180" height="6" rx="3" fill="#2a2a3a" opacity="0.3"/>
    <rect x="16" y="312" width="200" height="6" rx="3" fill="#2a2a3a" opacity="0.3"/>

    <!-- WATERMARK OVERLAY — diagonal repeating -->
    <g opacity="0.12" transform="rotate(-30, 140, 175)">
      <text x="40" y="60" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="120" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="180" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="240" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="300" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="360" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
      <text x="40" y="420" font-size="18" font-weight="700" fill="#e0304e" letter-spacing="6">AI GENERATED</text>
    </g>

    <!-- Detection badge -->
    <g transform="translate(170, 280)">
      <rect x="0" y="0" width="100" height="56" rx="8" fill="#12121a" stroke="#e0304e" stroke-width="1.5" opacity="0.95"/>
      <text x="50" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#e0304e" letter-spacing="1.5">DETECTED</text>
      <text x="50" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">AI Watermark</text>
      <text x="50" y="50" text-anchor="middle" font-size="8" fill="#8888aa">SynthID v2</text>
    </g>
  </g>

  <!-- Right: Watermark scan visualization -->
  <g transform="translate(560, 100)">
    <!-- Scan beam line -->
    <line x1="200" y1="0" x2="200" y2="430" stroke="url(#accent)" stroke-width="2" opacity="0.6">
      <animate attributeName="x1" values="160;240;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="160;240;160" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="0" x2="200" y2="430" stroke="#e0304e" stroke-width="4" opacity="0.15" filter="url(#blur2)">
      <animate attributeName="x1" values="160;240;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="160;240;160" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Pixel grid (showing watermark embedding) -->
    <g transform="translate(40, 30)" opacity="0.7">
      <!-- Grid of small squares representing pixels -->
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="16" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="32" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="48" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="64" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="80" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="96" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="112" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="128" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="144" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="160" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="176" y="0" width="12" height="12" rx="2" fill="#1e1e2e"/>

      <rect x="0" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="16" y="16" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/>
      <rect x="32" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="48" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="64" y="16" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/><rect x="80" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="96" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="112" y="16" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/>
      <rect x="128" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="144" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="160" y="16" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="176" y="16" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/>

      <rect x="0" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="16" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="32" y="32" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/><rect x="48" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="64" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="80" y="32" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/>
      <rect x="96" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="112" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="128" y="32" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/><rect x="144" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="160" y="32" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/><rect x="176" y="32" width="12" height="12" rx="2" fill="#1e1e2e"/>

      <rect x="0" y="48" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/><rect x="16" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="32" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="48" y="48" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/>
      <rect x="64" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="80" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="96" y="48" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/><rect x="112" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="128" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="144" y="48" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/>
      <rect x="160" y="48" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="176" y="48" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/>

      <rect x="0" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="16" y="64" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/>
      <rect x="32" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="48" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="64" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="80" y="64" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/>
      <rect x="96" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="112" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="128" y="64" width="12" height="12" rx="2" fill="#e0304e" opacity="0.3"/><rect x="144" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/>
      <rect x="160" y="64" width="12" height="12" rx="2" fill="#1e1e2e"/><rect x="176" y="64" width="12" height="12" rx="2" fill="#642f7f" opacity="0.3"/>
    </g>

    <!-- Labels -->
    <text x="200" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" opacity="0.9">Pixel-Level Watermark</text>
    <text x="200" y="170" text-anchor="middle" font-size="11" fill="#8888aa">SynthID embedded in image data</text>

    <!-- C2PA section below -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="360" height="180" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
      <text x="20" y="28" font-size="12" font-weight="700" fill="#642f7f" letter-spacing="2">C2PA CONTENT CREDENTIALS</text>
      <!-- File origin -->
      <rect x="20" y="44" width="320" height="36" rx="6" fill="#181828" stroke="#2a2a3a" stroke-width="0.5"/>
      <circle cx="40" cy="62" r="8" fill="#4ade80" opacity="0.2"/>
      <text x="40" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#4ade80">✓</text>
      <text x="58" y="58" font-size="10" font-weight="600" fill="#ffffff" opacity="0.8">Origin: AI Tool (Gemini / DALL·E)</text>
      <text x="58" y="72" font-size="9" fill="#8888aa">Signed: 2026-08-02T10:32:00Z</text>
      <!-- Edit history -->
      <rect x="20" y="88" width="320" height="28" rx="6" fill="#181828" stroke="#2a2a3a" stroke-width="0.5"/>
      <text x="36" y="106" font-size="9" fill="#8888aa">Edit 1: Crop (valid ✓) — Edit 2: Filter (valid ✓)</text>
      <!-- Tamper detection -->
      <rect x="20" y="122" width="320" height="28" rx="6" fill="#181828" stroke="#e0304e" stroke-width="0.5" opacity="0.6"/>
      <text x="36" y="140" font-size="9" fill="#e0304e" opacity="0.8">⚠ Metadata stripped → signature invalid</text>
      <!-- Status bar -->
      <rect x="20" y="158" width="320" height="4" rx="2" fill="#1e1e2e"/>
      <rect x="20" y="158" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
    </g>

    <text x="200" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" opacity="0.9">Tamper-Proof File Signature</text>
    <text x="200" y="438" text-anchor="middle" font-size="11" fill="#8888aa">C2PA cryptographically signed history</text>
  </g>

  <!-- Title -->
  <text x="600" y="580" text-anchor="middle" font-size="28" font-weight="800" fill="url(#accent)">AI Watermarking</text>
  <text x="600" y="608" text-anchor="middle" font-size="14" font-weight="600" fill="#8888aa" letter-spacing="3">SYNTHID · C2PA · EU AI ACT</text>
</svg>

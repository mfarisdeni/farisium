<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#642f7f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gradient-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="40%" stop-color="#e0304e"/>
      <stop offset="60%" stop-color="#642f7f"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <!-- Ambient glow -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Subtle background dots -->
  <g opacity="0.02">
    <circle cx="100" cy="100" r="2" fill="#e0e0e0"/><circle cx="300" cy="150" r="2" fill="#e0e0e0"/>
    <circle cx="500" cy="80" r="2" fill="#e0e0e0"/><circle cx="700" cy="200" r="2" fill="#e0e0e0"/>
    <circle cx="900" cy="120" r="2" fill="#e0e0e0"/><circle cx="1100" cy="180" r="2" fill="#e0e0e0"/>
    <circle cx="200" cy="400" r="2" fill="#e0e0e0"/><circle cx="450" cy="500" r="2" fill="#e0e0e0"/>
    <circle cx="650" cy="450" r="2" fill="#e0e0e0"/><circle cx="850" cy="520" r="2" fill="#e0e0e0"/>
    <circle cx="1050" cy="380" r="2" fill="#e0e0e0"/><circle cx="150" cy="550" r="2" fill="#e0e0e0"/>
  </g>
  <!-- Left content -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#5c0010"/>
    <text x="60" y="16" text-anchor="middle" fill="#e0304e" font-family="system-ui" font-size="10" font-weight="600" letter-spacing="1">AI TOOLS</text>
    <text y="60" fill="#e0e0e0" font-family="system-ui" font-size="32" font-weight="700" letter-spacing="-0.5">
      <tspan x="0" dy="0">AI untuk</tspan>
      <tspan x="0" dy="38" fill="#a0a0a0" font-weight="400" font-size="24">Content Creator</tspan>
    </text>
    <text y="140" fill="#a0a0a0" font-family="system-ui" font-size="14" font-weight="400" letter-spacing="0.2">
      <tspan x="0" dy="0">Tingkatkan produktivitas</tspan>
      <tspan x="0" dy="22">kreatifmu dengan AI tools</tspan>
      <tspan x="0" dy="22">yang tepat.</tspan>
    </text>
  </g>
  <!-- Right visual: tool cards -->
  <g transform="translate(680, 110)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="90" rx="14" fill="url(#card-grad)" stroke="#222" stroke-width="1"/>
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#5c0010"/>
    <rect x="18" y="18" width="16" height="16" rx="3" fill="none" stroke="#e0304e" stroke-width="1.5"/>
    <text x="50" y="28" fill="#e0e0e0" font-family="system-ui" font-size="13" font-weight="600">Image Generation</text>
    <text x="50" y="46" fill="#a0a0a0" font-family="system-ui" font-size="10">Buat gambar dengan AI</text>
    <text x="14" y="72" fill="#642f7f" font-family="system-ui" font-size="9" font-weight="500">Stable Diffusion</text>
    <!-- Card 2 -->
    <rect x="200" y="0" width="180" height="90" rx="14" fill="url(#card-grad)" stroke="#222" stroke-width="1"/>
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#5c0010"/>
    <line x1="22" y1="20" x2="30" y2="32" stroke="#e0304e" stroke-width="1.5"/>
    <line x1="30" y1="20" x2="22" y2="32" stroke="#e0304e" stroke-width="1.5"/>
    <text x="50" y="28" fill="#e0e0e0" font-family="system-ui" font-size="13" font-weight="600">Content Writing</text>
    <text x="50" y="46" fill="#a0a0a0" font-family="system-ui" font-size="10">Tulis artikel &amp; konten</text>
    <text x="14" y="72" fill="#642f7f" font-family="system-ui" font-size="9" font-weight="500">AI Assistant</text>
    <!-- Card 3 -->
    <rect x="0" y="110" width="180" height="90" rx="14" fill="url(#card-grad)" stroke="#222" stroke-width="1"/>
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#5c0010"/>
    <circle cx="26" cy="26" r="6" fill="none" stroke="#e0304e" stroke-width="1.5"/>
    <text x="50" y="28" fill="#e0e0e0" font-family="system-ui" font-size="13" font-weight="600">Video Editing</text>
    <text x="50" y="46" fill="#a0a0a0" font-family="system-ui" font-size="10">Edit video &amp; subtitle</text>
    <text x="14" y="72" fill="#642f7f" font-family="system-ui" font-size="9" font-weight="500">AI Tools</text>
    <!-- Card 4 -->
    <rect x="200" y="110" width="180" height="90" rx="14" fill="url(#card-grad)" stroke="#222" stroke-width="1"/>
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#5c0010"/>
    <rect x="20" y="20" width="12" height="12" rx="2" fill="none" stroke="#e0304e" stroke-width="1.5"/>
    <text x="50" y="28" fill="#e0e0e0" font-family="system-ui" font-size="13" font-weight="600">Analytics</text>
    <text x="50" y="46" fill="#a0a0a0" font-family="system-ui" font-size="10">Analisis performa</text>
    <text x="14" y="72" fill="#642f7f" font-family="system-ui" font-size="9" font-weight="500">Data Insight</text>
    <!-- Connecting lines -->
    <line x1="180" y1="45" x2="200" y2="45" stroke="#333" stroke-width="0.5"/>
    <line x1="180" y1="155" x2="200" y2="155" stroke="#333" stroke-width="0.5"/>
    <line x1="90" y1="90" x2="90" y2="110" stroke="#333" stroke-width="0.5"/>
    <line x1="290" y1="90" x2="290" y2="110" stroke="#333" stroke-width="0.5"/>
  </g>
  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#gradient-line)"/>
</svg>

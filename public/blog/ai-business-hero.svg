<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#100518" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0304e" />
      <stop offset="50%" stop-color="#7d4a96" />
      <stop offset="100%" stop-color="#e0304e" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Grid -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="250" cy="180" r="140" fill="rgba(224,48,78,0.06)" filter="url(#glowStrong)" />
  <circle cx="900" cy="420" r="120" fill="rgba(125,74,150,0.06)" filter="url(#glowStrong)" />
  <!-- Office/building icon -->
  <g transform="translate(380, 140)">
    <rect x="0" y="40" width="140" height="120" rx="6" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="10" y="50" width="35" height="35" rx="3" fill="rgba(224,48,78,0.15)" />
    <rect x="55" y="50" width="35" height="35" rx="3" fill="rgba(125,74,150,0.15)" />
    <rect x="100" y="50" width="30" height="35" rx="3" fill="rgba(255,255,255,0.05)" />
    <rect x="10" y="95" width="35" height="35" rx="3" fill="rgba(125,74,150,0.15)" />
    <rect x="55" y="95" width="35" height="35" rx="3" fill="rgba(255,255,255,0.05)" />
    <rect x="100" y="95" width="30" height="35" rx="3" fill="rgba(224,48,78,0.15)" />
    <!-- Roofline -->
    <rect x="0" y="32" width="140" height="8" rx="2" fill="url(#accent)" opacity="0.3" />
  </g>
  <!-- Growth chart -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="url(#card)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Chart line -->
    <polyline points="15,95 45,80 75,55 105,60 135,30 165,20" stroke="rgba(224,48,78,0.5)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chart area -->
    <path d="M15,95 L45,80 L75,55 L105,60 L135,30 L165,20 L165,120 L15,120 Z" fill="url(#accent)" opacity="0.06" />
    <!-- Data dots -->
    <circle cx="15" cy="95" r="3" fill="rgba(224,48,78,0.6)" />
    <circle cx="75" cy="55" r="3" fill="rgba(224,48,78,0.6)" />
    <circle cx="135" cy="30" r="3" fill="rgba(224,48,78,0.6)" />
    <circle cx="165" cy="20" r="4" fill="rgba(224,48,78,0.8)" />
  </g>
  <!-- Floating elements -->
  <g opacity="0.12">
    <rect x="300" y="440" width="90" height="22" rx="6" fill="rgba(125,74,150,0.3)" />
    <rect x="700" y="130" width="70" height="18" rx="6" fill="rgba(224,48,78,0.3)" />
    <rect x="420" y="470" width="110" height="18" rx="6" fill="rgba(255,255,255,0.04)" />
  </g>
  <!-- Bottom accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.3" />
  <g transform="translate(530, 560)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.15)" text-anchor="middle" letter-spacing="4">FARISIUM</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="ok" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-16}}
      @keyframes scan{0%{opacity:.3}50%{opacity:.8}100%{opacity:.3}}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      .dash{stroke-dasharray:8 4;animation:dash 1.5s linear infinite}
      .scan{animation:scan 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="400" cy="280" rx="300" ry="180" fill="url(#glow-r)" filter="url(#blur)"/>
  <ellipse cx="900" cy="320" rx="250" ry="150" fill="url(#glow-g)" filter="url(#blur)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">AI RESEARCH VERIFICATION WORKFLOW</text>

  <!-- Left side: AI Output (raw) -->
  <g filter="url(#shadow)">
    <rect x="60" y="100" width="220" height="160" rx="10" fill="#161b22" stroke="#e0304e" stroke-width="1.5"/>
    <text x="170" y="128" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e0304e" letter-spacing="1.5">AI OUTPUT</text>
    <!-- Fake text lines -->
    <rect x="85" y="145" width="170" height="6" rx="3" fill="#e0304e" opacity="0.2"/>
    <rect x="85" y="158" width="140" height="6" rx="3" fill="#e0304e" opacity="0.15"/>
    <rect x="85" y="171" width="160" height="6" rx="3" fill="#e0304e" opacity="0.2"/>
    <rect x="85" y="184" width="120" height="6" rx="3" fill="#e0304e" opacity="0.15"/>
    <rect x="85" y="197" width="155" height="6" rx="3" fill="#e0304e" opacity="0.2"/>
    <rect x="85" y="210" width="100" height="6" rx="3" fill="#e0304e" opacity="0.15"/>
    <rect x="85" y="223" width="165" height="6" rx="3" fill="#e0304e" opacity="0.2"/>
    <!-- Warning icon -->
    <circle cx="255" cy="125" r="10" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.5"/>
    <text x="255" y="129" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0883e">!</text>
  </g>

  <!-- Arrow from AI Output to Pipeline -->
  <line x1="280" y1="180" x2="370" y2="180" stroke="#e0304e" stroke-width="2" class="dash"/>

  <!-- Central Pipeline: 7 Steps -->
  <!-- Step 1: Question -->
  <g filter="url(#shadow)">
    <rect x="370" y="105" width="110" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="425" y="126" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">1. QUESTION</text>
    <text x="425" y="142" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Define scope</text>
  </g>
  <!-- Step 2: Claims -->
  <g filter="url(#shadow)">
    <rect x="370" y="165" width="110" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="425" y="186" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">2. CLAIMS</text>
    <text x="425" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Decompose</text>
  </g>
  <!-- Step 3: Classify -->
  <g filter="url(#shadow)">
    <rect x="370" y="225" width="110" height="50" rx="6" fill="#161b22" stroke="#642f7f" stroke-width="1.2"/>
    <text x="425" y="246" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#642f7f">3. CLASSIFY</text>
    <text x="425" y="262" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Fact vs fiction</text>
  </g>

  <!-- Connector dots between steps -->
  <circle cx="425" cy="160" r="2.5" fill="#3fb950" class="pulse"/>
  <circle cx="425" cy="220" r="2.5" fill="#642f7f" class="pulse"/>

  <!-- Arrow to verification zone -->
  <line x1="480" y1="180" x2="540" y2="180" stroke="#3fb950" stroke-width="2" class="dash"/>

  <!-- Verification Zone -->
  <rect x="540" y="80" width="320" height="210" rx="12" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="6 3" opacity="0.4"/>
  <text x="700" y="98" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#3fb950" letter-spacing="2" opacity="0.7">VERIFICATION ZONE</text>

  <!-- Step 4: Source -->
  <g filter="url(#shadow)">
    <rect x="555" y="115" width="140" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="625" y="138" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">4. PRIMARY SOURCE</text>
    <text x="625" y="155" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Find the origin</text>
  </g>
  <!-- Step 5: Triangulate -->
  <g filter="url(#shadow)">
    <rect x="710" y="115" width="140" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="780" y="138" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">5. TRIANGULATE</text>
    <text x="780" y="155" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Cross-validate</text>
  </g>
  <!-- Step 6: Context -->
  <g filter="url(#shadow)">
    <rect x="555" y="185" width="140" height="55" rx="6" fill="#161b22" stroke="#642f7f" stroke-width="1.2"/>
    <text x="625" y="208" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#642f7f">6. CONTEXT</text>
    <text x="625" y="225" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Verify meaning</text>
  </g>
  <!-- Step 7: Synthesize -->
  <g filter="url(#shadow)">
    <rect x="710" y="185" width="140" height="55" rx="6" fill="#161b22" stroke="#e0304e" stroke-width="1.2"/>
    <text x="780" y="208" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#e0304e">7. SYNTHESIZE</text>
    <text x="780" y="225" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Build conclusion</text>
  </g>

  <!-- Arrow from verification to output -->
  <line x1="860" y1="180" x2="930" y2="180" stroke="#3fb950" stroke-width="2" class="dash"/>

  <!-- Right side: Verified Research -->
  <g filter="url(#shadow)">
    <rect x="930" y="100" width="220" height="160" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="1040" y="128" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#3fb950" letter-spacing="1.5">VERIFIED RESEARCH</text>
    <!-- Clean check marks -->
    <g transform="translate(960,148)">
      <circle r="7" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    </g>
    <rect x="975" y="145" width="140" height="5" rx="2.5" fill="#3fb950" opacity="0.3"/>
    <g transform="translate(960,170)">
      <circle r="7" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    </g>
    <rect x="975" y="167" width="120" height="5" rx="2.5" fill="#3fb950" opacity="0.3"/>
    <g transform="translate(960,192)">
      <circle r="7" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    </g>
    <rect x="975" y="189" width="155" height="5" rx="2.5" fill="#3fb950" opacity="0.3"/>
    <g transform="translate(960,214)">
      <circle r="7" fill="#0a0a0f" stroke="#3fb950" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950">&#x2713;</text>
    </g>
    <rect x="975" y="211" width="100" height="5" rx="2.5" fill="#3fb950" opacity="0.3"/>
  </g>

  <!-- Bottom section: Hallucination types -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="1.5" opacity="0.6">COMMON AI HALLUCINATION PATTERNS</text>

  <!-- Hallucination type cards -->
  <g filter="url(#shadow)">
    <rect x="60" y="370" width="220" height="70" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="0.8" opacity="0.8"/>
    <circle cx="90" cy="395" r="10" fill="#0a0a0f" stroke="#e0304e" stroke-width="1.2"/>
    <text x="90" y="399" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0304e">A</text>
    <text x="110" y="399" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Fabricated Source</text>
    <text x="80" y="420" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Citation that does not exist</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="370" width="220" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="0.8" opacity="0.8"/>
    <circle cx="340" cy="395" r="10" fill="#0a0a0f" stroke="#f0883e" stroke-width="1.2"/>
    <text x="340" y="399" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0883e">B</text>
    <text x="360" y="399" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Wrong Context</text>
    <text x="330" y="420" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Real data, wrong interpretation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="370" width="220" height="70" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="0.8" opacity="0.8"/>
    <circle cx="590" cy="395" r="10" fill="#0a0a0f" stroke="#642f7f" stroke-width="1.2"/>
    <text x="590" y="399" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#642f7f">C</text>
    <text x="610" y="399" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Outdated Data</text>
    <text x="580" y="420" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Old info presented as current</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="810" y="370" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="0.8" opacity="0.8"/>
    <circle cx="840" cy="395" r="10" fill="#0a0a0f" stroke="#3fb950" stroke-width="1.2"/>
    <text x="840" y="399" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950">D</text>
    <text x="860" y="399" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e6edf3">Overconfident</text>
    <text x="830" y="420" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#8b949e">Prediction stated as fact</text>
  </g>

  <!-- Confidence meter: unverified vs verified -->
  <g opacity="0.7">
    <rect x="100" y="480" width="400" height="28" rx="14" fill="#161b22" stroke="#e0304e" stroke-width="0.8"/>
    <rect x="102" y="482" width="196" height="24" rx="12" fill="#e0304e" opacity="0.2"/>
    <text x="200" y="498" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#e0304e">UNVERIFIED: confident but unreliable</text>
    <rect x="550" y="480" width="400" height="28" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="0.8"/>
    <rect x="552" y="482" width="396" height="24" rx="12" fill="#3fb950" opacity="0.15"/>
    <text x="750" y="498" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#3fb950">VERIFIED: checked against evidence</text>
  </g>

  <!-- Accent line -->
  <rect x="540" y="540" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="600" y="575" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" letter-spacing="1" opacity="0.5">7-STEP WORKFLOW TO USE AI FOR RESEARCH WITHOUT HALLUCINATIONS</text>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>

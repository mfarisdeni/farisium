<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="50%" style="stop-color:#9b72cb"/>
      <stop offset="100%" style="stop-color:#ea4335"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Ambient glow -->
  <circle cx="600" cy="315" r="300" fill="url(#glow)" filter="url(#blur1)"/>
  <circle cx="350" cy="200" r="150" fill="#4285f4" opacity="0.05" filter="url(#blur1)"/>
  <circle cx="850" cy="430" r="180" fill="#34a853" opacity="0.04" filter="url(#blur1)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#4285f4" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Gemini star icon -->
  <g transform="translate(600,220)">
    <path d="M0,-80 L18,-25 L75,-25 L28,10 L45,65 L0,30 L-45,65 L-28,10 L-75,-25 L-18,-25 Z" fill="url(#geminiGrad)" opacity="0.9"/>
    <path d="M0,-80 L18,-25 L75,-25 L28,10 L45,65 L0,30 L-45,65 L-28,10 L-75,-25 L-18,-25 Z" fill="none" stroke="url(#geminiGrad)" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Neural network nodes -->
  <g opacity="0.15">
    <circle cx="180" cy="150" r="4" fill="#4285f4"/>
    <circle cx="280" cy="120" r="3" fill="#9b72cb"/>
    <circle cx="380" cy="180" r="5" fill="#34a853"/>
    <circle cx="820" cy="450" r="4" fill="#ea4335"/>
    <circle cx="920" cy="480" r="3" fill="#4285f4"/>
    <circle cx="1020" cy="420" r="5" fill="#fbbc04"/>
    <circle cx="150" cy="480" r="3" fill="#34a853"/>
    <circle cx="1050" cy="150" r="4" fill="#9b72cb"/>
    <circle cx="950" cy="200" r="3" fill="#4285f4"/>
    <circle cx="250" cy="500" r="4" fill="#ea4335"/>
  </g>
  
  <!-- Connection lines -->
  <g opacity="0.06" stroke="#4285f4" stroke-width="1">
    <line x1="180" y1="150" x2="380" y2="180"/>
    <line x1="380" y1="180" x2="600" y2="220"/>
    <line x1="820" y1="450" x2="1020" y2="420"/>
    <line x1="920" y1="480" x2="1050" y2="150"/>
  </g>
  
  <!-- Search bar illustration -->
  <g transform="translate(600,400)">
    <rect x="-280" y="-30" width="560" height="60" rx="30" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="-240" cy="0" r="12" fill="none" stroke="#4285f4" stroke-width="2"/>
    <line x1="-231" y1="9" x2="-222" y2="18" stroke="#4285f4" stroke-width="2"/>
    <text x="-210" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b949e" font-weight="400">Ask AI Mode anything...</text>
    <rect x="210" y="-18" width="50" height="36" rx="18" fill="#4285f4" opacity="0.8"/>
    <text x="223" y="5" font-family="Inter, system-ui, sans-serif" font-size="14" fill="white" font-weight="500">Go</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" fill="#e6edf3" font-weight="700" letter-spacing="-0.5">What Model Powers Google AI Mode?</text>
  <text x="600" y="570" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b949e" font-weight="400">Deep Dive into Gemini 3 in Search</text>
  
  <!-- Farisium badge -->
  <g transform="translate(600,610)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#484f58" font-weight="500" letter-spacing="2">FARISIUM</text>
  </g>
</svg>

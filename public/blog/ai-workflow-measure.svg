<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      @keyframes glow { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
      @keyframes rise { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes dash { to { stroke-dashoffset:-20 } }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .rise { animation: rise 0.9s ease-out both; }
      .dash { animation: dash 1.6s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="430" ry="210" fill="url(#glow-g)" filter="url(#blur50)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="2">IS THE WORKFLOW ACTUALLY BETTER?</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">BEFORE vs AFTER AI</text>

  <!-- Before circle -->
  <g class="rise" style="animation-delay:0s">
    <circle cx="330" cy="262" r="110" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="330" cy="262" r="76" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 8" class="dash" opacity="0.5"/>
    <text x="330" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#8b949e">9.2</text>
    <text x="330" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e">hours / task</text>
    <text x="330" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Before AI</text>
    <text x="330" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">manual, fragmented</text>
  </g>

  <!-- Arrow -->
  <g class="pulse">
  </g>
  <rect x="475" y="252" width="250" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="475" y="252" width="250" height="4" rx="2" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="6 14" class="dash" opacity="0.9"/>
  <polygon points="735,254 725,248 725,260" fill="#e0304e"/>
  <text x="600" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e0304e">58% faster</text>

  <!-- After circle -->
  <g class="rise" style="animation-delay:0.3s">
    <circle cx="870" cy="262" r="110" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <circle cx="870" cy="262" r="76" fill="none" stroke="#e0304e" stroke-width="1.5" stroke-dasharray="4 8" class="dash" opacity="0.5"/>
    <text x="870" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">3.9</text>
    <text x="870" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e">hours / task</text>
    <text x="870" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">After AI</text>
    <text x="870" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">automated + reviewed</text>
  </g>

  <!-- Metrics row -->
  <g class="rise" style="animation-delay:0.6s">
    <rect x="95" y="430" width="240" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="215" y="466" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e0304e">-40%</text>
    <text x="215" y="492" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">Completion time</text>
    <text x="215" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">whole process measured</text>
  </g>
  <g class="rise" style="animation-delay:0.75s">
    <rect x="480" y="430" width="240" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="600" y="466" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">-60%</text>
    <text x="600" y="492" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">Correction rate</text>
    <text x="600" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">fewer full rewrites</text>
  </g>
  <g class="rise" style="animation-delay:0.9s">
    <rect x="865" y="430" width="240" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="985" y="466" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e0304e">▲</text>
    <text x="985" y="492" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">Quality stable</text>
    <text x="985" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">error rate reviewed</text>
  </g>

  <!-- Brand -->
  <text x="600" y="598" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e" opacity="0.7" letter-spacing="2">farisium.com</text>
</svg>

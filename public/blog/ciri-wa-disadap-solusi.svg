<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
    <style>
      @keyframes pulse2{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes check{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
      @keyframes shield{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      .pulse2{animation:pulse2 2s ease-in-out infinite}
      .check-anim{stroke-dasharray:20;animation:check 1.5s ease-out forwards}
      .shield-anim{animation:shield 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <ellipse cx="600" cy="300" rx="380" ry="200" fill="url(#glow2)" filter="url(#blur2)"/>

  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#e6edf3" letter-spacing="2" opacity="0.8">STEPS TO SECURE YOUR WHATSAPP</text>

  <g transform="translate(600,140)" class="shield-anim">
    <path d="M0,-50 L45,-30 L45,15 Q45,50 0,65 Q-45,50 -45,15 L-45,-30 Z" fill="#161b22" stroke="#25D366" stroke-width="2"/>
    <path d="M0,-35 L30,-20 L30,10 Q30,35 0,48 Q-30,35 -30,10 L-30,-20 Z" fill="none" stroke="#25D366" stroke-width="1" opacity="0.4"/>
    <text y="8" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#25D366">W</text>
    <circle cx="0" cy="-10" r="50" fill="none" stroke="#25D366" stroke-width="0.5" opacity="0.2" class="pulse2"/>
  </g>

  <g filter="url(#sh2)">
    <rect x="60" y="210" width="280" height="70" rx="8" fill="#161b22" stroke="#25D366" stroke-width="1.5"/>
    <rect x="60" y="210" width="50" height="70" rx="8" fill="#25D366" opacity="0.15"/>
    <text x="85" y="250" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#25D366">1</text>
    <text x="125" y="238" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Log Out Foreign Devices</text>
    <text x="125" y="258" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Linked Devices &gt; Log out all</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="60" y="295" width="280" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <rect x="60" y="295" width="50" height="70" rx="8" fill="#f0883e" opacity="0.15"/>
    <text x="85" y="335" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#f0883e">2</text>
    <text x="125" y="323" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Enable Two-Factor Auth</text>
    <text x="125" y="343" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Settings &gt; Account &gt; Two-step</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="60" y="380" width="280" height="70" rx="8" fill="#161b22" stroke="#642f7f" stroke-width="1.5"/>
    <rect x="60" y="380" width="50" height="70" rx="8" fill="#642f7f" opacity="0.15"/>
    <text x="85" y="420" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#642f7f">3</text>
    <text x="125" y="408" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Clear Cache &amp; Data</text>
    <text x="125" y="428" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Reinstall WhatsApp</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="60" y="465" width="280" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="60" y="465" width="50" height="70" rx="8" fill="#3fb950" opacity="0.15"/>
    <text x="85" y="505" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#3fb950">4</text>
    <text x="125" y="493" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Notify Your Contacts</text>
    <text x="125" y="513" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Tell them to ignore weird messages</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="420" y="210" width="360" height="325" rx="8" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.1" stroke-width="1"/>
    <text x="445" y="240" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">SECURITY CHECKLIST</text>
    <text x="445" y="258" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Make sure everything is done:</text>

    <g transform="translate(445,278)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">Two-step verification enabled</text>
    </g>
    <g transform="translate(445,306)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.15s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">6-digit PIN is set</text>
    </g>
    <g transform="translate(445,334)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.3s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">No foreign devices active</text>
    </g>
    <g transform="translate(445,362)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.45s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">Fingerprint lock enabled</text>
    </g>
    <g transform="translate(445,390)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.6s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">Block unknown senders active</text>
    </g>
    <g transform="translate(445,418)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.75s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">Never share OTP with anyone</text>
    </g>
    <g transform="translate(445,446)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:0.9s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">Regularly change 2FA PIN</text>
    </g>
    <g transform="translate(445,474)">
      <rect width="14" height="14" rx="3" fill="#0a0a0f" stroke="#25D366" stroke-width="1.5"/>
      <path d="M3,7 L6,10 L11,4" fill="none" stroke="#25D366" stroke-width="2" class="check-anim" style="animation-delay:1.05s"/>
      <text x="22" y="11" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#e6edf3">End-to-end backup enabled</text>
    </g>
  </g>

  <g filter="url(#sh2)">
    <rect x="820" y="210" width="310" height="325" rx="8" fill="#161b22" stroke="#e0304e" stroke-width="1"/>
    <text x="845" y="240" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e0304e">IF IT'S ALREADY SEVERE</text>
    <text x="845" y="258" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Emergency steps if WA is hacked:</text>

    <g transform="translate(845,280)">
      <rect x="0" y="0" width="270" height="50" rx="6" fill="#0a0a0f" stroke="#e0304e" stroke-width="0.8"/>
      <text x="15" y="20" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#e0304e">1. REPORT TO WHATSAPP</text>
      <text x="15" y="36" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Send email to support@whatsapp.com</text>
    </g>
    <g transform="translate(845,340)">
      <rect x="0" y="0" width="270" height="50" rx="6" fill="#0a0a0f" stroke="#f0883e" stroke-width="0.8"/>
      <text x="15" y="20" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#f0883e">2. REMOVE ACCOUNT FROM OTHER DEVICES</text>
      <text x="15" y="36" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Log out from all devices</text>
    </g>
    <g transform="translate(845,400)">
      <rect x="0" y="0" width="270" height="50" rx="6" fill="#0a0a0f" stroke="#642f7f" stroke-width="0.8"/>
      <text x="15" y="20" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#642f7f">3. CHANGE NUMBER IF NEEDED</text>
      <text x="15" y="36" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Switch to a new number if compromised</text>
    </g>
    <g transform="translate(845,460)">
      <rect x="0" y="0" width="270" height="50" rx="6" fill="#0a0a0f" stroke="#3fb950" stroke-width="0.8"/>
      <text x="15" y="20" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#3fb950">4. FILE A POLICE REPORT</text>
      <text x="15" y="36" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#8b949e">Report if there are losses</text>
    </g>
  </g>

  <rect x="500" y="555" width="200" height="2" rx="1" fill="url(#accent2)" opacity="0.5"/>
  <text x="600" y="585" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" letter-spacing="1" opacity="0.5">COMPLETE WHATSAPP SECURITY GUIDE 2026</text>

  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
  <text x="60" y="600" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8b949e" opacity="0.5" letter-spacing="2">FARISIUM</text>
</svg>
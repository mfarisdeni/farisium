<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e"/>
      <stop offset="100%" stop-color="#642f7f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0304e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#642f7f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }
      @keyframes glow { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
      @keyframes dash { to { stroke-dashoffset:-16 } }
      @keyframes rise { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .dash { animation: dash 1.4s linear infinite; }
      .rise { animation: rise 0.9s ease-out both; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="430" ry="210" fill="url(#glow-g)" filter="url(#blur50)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#e6edf3" stroke-width="0.5">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="2">AI WORKFLOW FRAMEWORK</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">FOUR LAYERS THAT ACTUALLY SAVE TIME</text>

  <!-- Flow line -->
  <rect x="120" y="360" width="960" height="3" rx="1.5" fill="url(#flow)" opacity="0.35"/>
  <rect x="120" y="360" width="960" height="3" rx="1.5" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 16" class="dash" opacity="0.9"/>

  <!-- Layer 1: Trigger -->
  <g class="rise" style="animation-delay:0s">
    <circle cx="195" cy="360" r="28" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="195" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e0304e">1</text>
    <circle cx="195" cy="360" r="36" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow"/>
    <text x="195" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Trigger</text>
    <text x="195" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Clear beginning</text>
  </g>

  <!-- Layer 2: AI Task -->
  <g class="rise" style="animation-delay:0.3s">
    <circle cx="465" cy="360" r="28" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="465" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b57edd">2</text>
    <circle cx="465" cy="360" r="36" fill="none" stroke="#642f7f" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:0.6s"/>
    <text x="465" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">AI Task</text>
    <text x="465" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Narrow job</text>
  </g>

  <!-- Layer 3: Human Control -->
  <g class="rise" style="animation-delay:0.6s">
    <circle cx="735" cy="360" r="28" fill="#161b22" stroke="#e0304e" stroke-width="2"/>
    <text x="735" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e0304e">3</text>
    <circle cx="735" cy="360" r="36" fill="none" stroke="#e0304e" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:1.2s"/>
    <text x="735" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Human Control</text>
    <text x="735" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Preserve judgment</text>
  </g>

  <!-- Layer 4: Output -->
  <g class="rise" style="animation-delay:0.9s">
    <circle cx="1005" cy="360" r="28" fill="#161b22" stroke="#642f7f" stroke-width="2"/>
    <text x="1005" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b57edd">4</text>
    <circle cx="1005" cy="360" r="36" fill="none" stroke="#642f7f" stroke-width="0.6" opacity="0.35" class="glow" style="animation-delay:1.8s"/>
    <text x="1005" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Output</text>
    <text x="1005" y="442" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8b949e">Used by next step</text>
  </g>

  <!-- Key principle banner -->
  <rect x="295" y="500" width="610" height="64" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="1" opacity="0.92"/>
  <text x="600" y="527" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Automate repetition. Preserve judgment.</text>
  <text x="600" y="548" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">AI removes friction from the process — it does not replace people.</text>

  <!-- Brand -->
  <text x="600" y="598" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b949e" opacity="0.7" letter-spacing="2">farisium.com</text>
</svg>
